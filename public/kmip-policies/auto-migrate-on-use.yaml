# Transparent auto-migration policy — the crypto-agility headline turned into a
# standing rule set. Existing classical keys are rekeyed to their PQC equivalent
# the FIRST time they are used (lazy, key-by-key, no big-bang re-issue); new keys
# default to PQC. The application keeps the same handle and the same call — the
# engine swaps the algorithm underneath and emits Decision::RekeyAndProceed.

schema_version: 1

metadata:
  name: auto-migrate-on-use
  description: |
    Lazy, transparent migration. Each legacy classical signing key is rekeyed
    to PQC the first time traffic touches it (Sign), each legacy classical
    key-establishment key likewise rekeys at first Encapsulate (2026-07-05),
    and new keys default to quantum-safe algorithms: signing key pairs to
    ML-DSA-65, key-establishment key pairs to ML-KEM-768, symmetric keys to
    AES-256. (RSA key-transport's Encrypt-path rekey remains deferred — see
    the rule comments.) There is no flag day and no application change —
    migration advances key-by-key as the workload exercises each one. This
    is the substitution ("rekey-on-use") dimension of crypto agility that
    KMIP alone cannot express.

    Every classical signing/key-establishment algorithm this stack can
    instantiate has an explicit rekey target (2026-08-28 audit finding B2 —
    previously ECDSA-P521, RSA-2048, RSA-4096, Ed25519, Ed448, ECDH-P521,
    X25519 and X448 had none, so a key using one of them kept operating
    classically forever with no signal); a class-based backstop denies any
    classical Sign/Encapsulate that somehow still isn't covered, so a gap
    fails loud instead of failing open.
  authority: pqctoday-hsm/training
  effective: "2026-01-01"
  compliance_mapping:
    - { framework: "FIPS 203 ML-KEM", status: required }
    - { framework: "FIPS 204 ML-DSA", status: required }
    - { framework: "NIST IR 8547",    status: aligned }

rules:

  # ── New keys default to PQC ───────────────────────────────────────────
  - type: algorithm_default
    ops: ["CreateKeyPair:Sign"]
    default_algorithm: ML-DSA-65
    reason: "New signing keys default to ML-DSA-65 (FIPS 204)"
  - type: algorithm_default
    ops: ["CreateKeyPair:KeyAgreement"]
    default_algorithm: ML-KEM-768
    reason: "New key-establishment keys default to ML-KEM-768 (FIPS 203)"
  - type: algorithm_default
    ops: [Create]
    default_algorithm: AES-256
    reason: "New symmetric keys default to AES-256 (quantum-safe at 256-bit)"

  # ── Existing signing keys auto-rekey at first Sign ────────────────────
  # The engine generates a fresh PQC key, marks the classical one Deprecated,
  # links them via x-pqctoday-supersedes, and re-issues the Sign — all behind
  # the original handle.
  - type: algorithm_substitution
    ops: [Sign]
    from: ECDSA-P256
    to: ML-DSA-65
    reason: "Rekey legacy ECDSA-P256 signing key to ML-DSA-65 at first use"
  - type: algorithm_substitution
    ops: [Sign]
    from: ECDSA-P384
    to: ML-DSA-87
    reason: "Rekey legacy ECDSA-P384 signing key to ML-DSA-87 at first use"
  - type: algorithm_substitution
    ops: [Sign]
    from: ECDSA-P521
    to: ML-DSA-87
    reason: "Rekey legacy ECDSA-P521 signing key to ML-DSA-87 at first use"
  - type: algorithm_substitution
    ops: [Sign]
    from: RSA-2048
    to: ML-DSA-65
    reason: "Rekey legacy RSA-2048 signing key to ML-DSA-65 at first use"
  - type: algorithm_substitution
    ops: [Sign]
    from: RSA-3072
    to: ML-DSA-65
    reason: "Rekey legacy RSA-3072 signing key to ML-DSA-65 at first use"
  - type: algorithm_substitution
    ops: [Sign]
    from: RSA-4096
    to: ML-DSA-87
    reason: "Rekey legacy RSA-4096 signing key to ML-DSA-87 at first use"
  - type: algorithm_substitution
    ops: [Sign]
    from: Ed25519
    to: ML-DSA-65
    reason: "Rekey legacy Ed25519 signing key to ML-DSA-65 at first use"
  - type: algorithm_substitution
    ops: [Sign]
    from: Ed448
    to: ML-DSA-87
    reason: "Rekey legacy Ed448 signing key to ML-DSA-87 at first use"

  # ── Existing key-establishment keys auto-rekey at first Encapsulate
  # (2026-07-05 — closes the deferral below for the ECDH side) ──────────
  # Classical ECDH key-establishment now goes through `Encapsulate` (DHKEM
  # mode), the same op ML-KEM/hybrid use, so — unlike RSA key-transport
  # below — this is a same-op rekey the engine can execute directly, exactly
  # like the Sign-side rules above.
  #
  # `from:` values — CORRECTED 2026-08-28 (audit finding B5). This comment
  # previously claimed X25519/X448 "currently stringify identically to real
  # P-256", so one ECDH-P256 rule was said to cover all three. That stopped
  # being true: `helpers::montgomery_name_for_len` gives length-255/448
  # Montgomery keys their own distinct policy names (`X25519`, `X448`)
  # rather than falling through to `ECDH-P{bits}`, so those keys silently
  # never matched `from: ECDH-P256` and never rekeyed. Explicit rules below.
  - type: algorithm_substitution
    ops: [Encapsulate]
    from: ECDH-P256
    to: ML-KEM-768
    reason: "Rekey legacy ECDH-P256 key-establishment key to ML-KEM-768 at first use"
  - type: algorithm_substitution
    ops: [Encapsulate]
    from: ECDH-P384
    to: ML-KEM-768
    reason: "Rekey legacy ECDH-P384 key-establishment key to ML-KEM-768 at first use"
  - type: algorithm_substitution
    ops: [Encapsulate]
    from: ECDH-P521
    to: ML-KEM-768
    reason: "Rekey legacy ECDH-P521 key-establishment key to ML-KEM-768 at first use"
  - type: algorithm_substitution
    ops: [Encapsulate]
    from: X25519
    to: ML-KEM-768
    reason: "Rekey legacy X25519 key-establishment key to ML-KEM-768 at first use"
  - type: algorithm_substitution
    ops: [Encapsulate]
    from: X448
    to: ML-KEM-768
    reason: "Rekey legacy X448 key-establishment key to ML-KEM-768 at first use"

  # RSA key-TRANSPORT (Encrypt/Decrypt, distinct from ECDH key-ESTABLISHMENT
  # above) → ML-KEM remains deferred: a cross-primitive migration (encrypt →
  # encapsulate) the Encrypt op cannot execute in one call. The Sign-side
  # and Encapsulate-side rekeys above are the live demo for their
  # respective primitives.

  # ── Backstop: any classical Sign/Encapsulate not covered above must fail
  # loud, not run classically forever (2026-08-28 audit finding B2). Pass 1
  # (resolution, including the substitutions above) runs before Pass 2
  # (gating), so a key whose algorithm WAS successfully substituted to PQC
  # is gated against its NEW algorithm here and never matches
  # `algorithm_class: classical` — only a genuinely uncovered classical
  # algorithm (one with no `from:` rule above) reaches this deny. That is
  # the intended effect: a coverage gap becomes a loud, diagnosable denial
  # instead of a silent "keeps working classically forever".
  - type: temporal_cutoff
    op: Sign
    algorithm_class: classical
    after: "always"
    reason: "No classical signing algorithm reaches this policy without an explicit PQC rekey target"
  - type: temporal_cutoff
    op: Encapsulate
    algorithm_class: classical
    after: "always"
    reason: "No classical key-establishment algorithm reaches this policy without an explicit PQC rekey target"

  # ── No NEW classical asymmetric keys while migrating ──────────────────
  - type: algorithm_denylist
    ops:
      - CreateKeyPair
      - "CreateKeyPair:Sign"
      - "CreateKeyPair:KeyAgreement"
    # RSA (family entry) covers every RSA size incl. 4096; curve names listed
    # exhaustively (family matching is prefix-based, so ECDSA-P521 / Ed448 /
    # X25519 need their own entries — added 2026-07-02; ECDH-P521 added
    # 2026-08-28, audit finding B4's same gap in a third file).
    algorithms: [RSA, ECDSA-P256, ECDSA-P384, ECDSA-P521, Ed25519, Ed448, ECDH-P256, ECDH-P384, ECDH-P521, X25519, X448]
    reason: "Migration in progress — create PQC keys; legacy keys rekey on use"

  # ── Signing only with Active keys ─────────────────────────────────────
  - type: lifecycle_state_gate
    op: Sign
    allowed_states: [Active]
    reason: "Sign only with Active keys (no Deactivated/Compromised re-use)"
