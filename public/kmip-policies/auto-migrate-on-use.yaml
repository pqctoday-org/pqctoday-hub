# Transparent auto-migration policy — the crypto-agility headline turned into a
# standing rule set. Existing classical keys are rekeyed to their PQC equivalent
# the FIRST time they are used (lazy, key-by-key, no big-bang re-issue); new keys
# default to PQC. The application keeps the same handle and the same call — the
# engine swaps the algorithm underneath and emits Decision::RekeyAndProceed.

schema_version: 1

metadata:
  name: auto-migrate-on-use
  description: |
    Lazy, transparent migration. Each legacy classical signing key is rekeyed
    to PQC the first time traffic touches it (Sign), each legacy classical
    key-establishment key likewise rekeys at first Encapsulate (2026-07-05),
    and new keys default to quantum-safe algorithms: signing key pairs to
    ML-DSA-65, key-establishment key pairs to ML-KEM-768, symmetric keys to
    AES-256. (RSA key-transport's Encrypt-path rekey remains deferred — see
    the rule comments.) There is no flag day and no application change —
    migration advances key-by-key as the workload exercises each one. This
    is the substitution ("rekey-on-use") dimension of crypto agility that
    KMIP alone cannot express.
  authority: pqctoday-hsm/training
  effective: "2026-01-01"
  compliance_mapping:
    - { framework: "FIPS 203 ML-KEM", status: required }
    - { framework: "FIPS 204 ML-DSA", status: required }
    - { framework: "NIST IR 8547",    status: aligned }

rules:

  # ── New keys default to PQC ───────────────────────────────────────────
  - type: algorithm_default
    ops: ["CreateKeyPair:Sign"]
    default_algorithm: ML-DSA-65
    reason: "New signing keys default to ML-DSA-65 (FIPS 204)"
  - type: algorithm_default
    ops: ["CreateKeyPair:KeyAgreement"]
    default_algorithm: ML-KEM-768
    reason: "New key-establishment keys default to ML-KEM-768 (FIPS 203)"
  - type: algorithm_default
    ops: [Create]
    default_algorithm: AES-256
    reason: "New symmetric keys default to AES-256 (quantum-safe at 256-bit)"

  # ── Existing signing keys auto-rekey at first Sign ────────────────────
  # The engine generates a fresh PQC key, marks the classical one Deprecated,
  # links them via x-pqctoday-supersedes, and re-issues the Sign — all behind
  # the original handle.
  - type: algorithm_substitution
    ops: [Sign]
    from: ECDSA-P256
    to: ML-DSA-65
    reason: "Rekey legacy ECDSA-P256 signing key to ML-DSA-65 at first use"
  - type: algorithm_substitution
    ops: [Sign]
    from: ECDSA-P384
    to: ML-DSA-87
    reason: "Rekey legacy ECDSA-P384 signing key to ML-DSA-87 at first use"
  - type: algorithm_substitution
    ops: [Sign]
    from: RSA-3072
    to: ML-DSA-65
    reason: "Rekey legacy RSA-3072 signing key to ML-DSA-65 at first use"

  # ── Existing key-establishment keys auto-rekey at first Encapsulate
  # (2026-07-05 — closes the deferral below for the ECDH side) ──────────
  # Classical ECDH key-establishment now goes through `Encapsulate` (DHKEM
  # mode), the same op ML-KEM/hybrid use, so — unlike RSA key-transport
  # below — this is a same-op rekey the engine can execute directly, exactly
  # like the Sign-side rules above.
  #
  # NOTE — `from:` collision (pre-existing `qualified_name` limitation, not
  # introduced here): X25519 (256 bits) and X448 (448→default 256) both
  # currently stringify identically to real P-256 (`ECDH-P256`), so the
  # first rule below already covers all three (harmless — all migrate to
  # the same ML-KEM-768 target); a future fix to give them distinct names
  # would need a corresponding split.
  - type: algorithm_substitution
    ops: [Encapsulate]
    from: ECDH-P256
    to: ML-KEM-768
    reason: "Rekey legacy ECDH-P256/X25519/X448 key-establishment key to ML-KEM-768 at first use"
  - type: algorithm_substitution
    ops: [Encapsulate]
    from: ECDH-P384
    to: ML-KEM-768
    reason: "Rekey legacy ECDH-P384 key-establishment key to ML-KEM-768 at first use"

  # RSA key-TRANSPORT (Encrypt/Decrypt, distinct from ECDH key-ESTABLISHMENT
  # above) → ML-KEM remains deferred: a cross-primitive migration (encrypt →
  # encapsulate) the Encrypt op cannot execute in one call. The Sign-side
  # and Encapsulate-side rekeys above are the live demo for their
  # respective primitives.

  # ── No NEW classical asymmetric keys while migrating ──────────────────
  - type: algorithm_denylist
    ops:
      - CreateKeyPair
      - "CreateKeyPair:Sign"
      - "CreateKeyPair:KeyAgreement"
    # RSA (family entry) covers every RSA size incl. 4096; curve names listed
    # exhaustively (family matching is prefix-based, so ECDSA-P521 / Ed448 /
    # X25519 need their own entries — added 2026-07-02).
    algorithms: [RSA, ECDSA-P256, ECDSA-P384, ECDSA-P521, Ed25519, Ed448, ECDH-P256, ECDH-P384, X25519, X448]
    reason: "Migration in progress — create PQC keys; legacy keys rekey on use"

  # ── Signing only with Active keys ─────────────────────────────────────
  - type: lifecycle_state_gate
    op: Sign
    allowed_states: [Active]
    reason: "Sign only with Active keys (no Deactivated/Compromised re-use)"
