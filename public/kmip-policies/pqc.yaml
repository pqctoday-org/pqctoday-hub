# PQC crypto policy — the "after" half of the agility demo.
#
# Pair this with `classical.yaml`. The application code does NOT change
# between the two policies. Flipping the Hub UI dropdown from `classical`
# to `pqc` does three things to the unchanged application:
#
#   1. New KEM keys default to ML-KEM-1024 (was ECDH-P256).
#   2. New signing keys default to ML-DSA-87 (was ECDSA-P256).
#   3. Existing classical keys auto-rekey to PQC at first Sign / Encapsulate
#      via the substitution rules below — the engine emits
#      Decision::RekeyAndProceed, the dispatcher executes the multi-op
#      rekey transaction (new key pair → activate both halves → deactivate
#      + supersede both old halves → re-issue the original op).
#
# This is the bit KMIP 3.0 alone cannot do — it's the agility engine's
# value-add. See `classical.yaml` for the op-name convention.

schema_version: 1

metadata:
  name: pqc
  description: |
    Post-PQC default policy. KEM = ML-KEM-1024, signature = ML-DSA-87,
    asymmetric-encrypt = ML-KEM-1024 (key delivery) + AES-256 (bulk).
    Existing classical SIGNING keys (ECDSA P-256/384/521, RSA-3072) are
    auto-rekeyed to ML-DSA-87 at first Sign via algorithm_substitution —
    the application sees only the handle. Existing classical
    KEY-ESTABLISHMENT keys (ECDH-P256/384/521, X25519, X448) are likewise
    auto-rekeyed to ML-KEM-1024 at first Encapsulate (2026-07-05). RSA
    key-TRANSPORT (the Encrypt/Decrypt path) → ML-KEM remains deferred — a
    cross-primitive migration the Encrypt op cannot execute in one call;
    legacy classical keys can still Verify/Decrypt during the transition.
  authority: pqctoday-hsm/demo
  effective: "2026-01-01"
  compliance_mapping:
    - { framework: "FIPS 203 ML-KEM",  status: required }
    - { framework: "FIPS 204 ML-DSA",  status: required }
    - { framework: "FIPS 197 AES-256", status: required }
    - { framework: "NSA CNSA-2.0",     status: aligned }

rules:

  # ── KEM default → ML-KEM-1024 ─────────────────────────────────────────
  - type: algorithm_default
    ops: ["CreateKeyPair:KeyAgreement"]
    default_algorithm: ML-KEM-1024
    reason: "PQC KEM default (FIPS 203, CNSA 2.0 Level 5)"

  # ── Signature default → ML-DSA-87 ─────────────────────────────────────
  - type: algorithm_default
    ops: ["CreateKeyPair:Sign"]
    default_algorithm: ML-DSA-87
    reason: "PQC signature default (FIPS 204, CNSA 2.0 Level 5)"

  # ── Asymmetric encryption default → ML-KEM-1024 ──────────────────────
  # ML-KEM delivers the AES bulk key.
  - type: algorithm_default
    ops: ["CreateKeyPair:Encrypt"]
    default_algorithm: ML-KEM-1024
    reason: "PQC asymmetric encryption: ML-KEM key delivery + AES-256 bulk"

  # ── Symmetric encryption default ─────────────────────────────────────
  # Unchanged from classical — AES-256 is PQC-safe (Grover halves the
  # security level; AES-256 → 128-bit post-quantum security, still safe).
  - type: algorithm_default
    ops: [Create]
    default_algorithm: AES-256
    reason: "AES-256 — PQC-safe symmetric (Grover-resistant)"

  # ── Existing-key rekey: classical signing → ML-DSA-87 on Sign ─────────
  # Triggered when the application calls Sign against a key created under
  # classical.yaml. Engine emits Decision::RekeyAndProceed — dispatcher
  # generates a fresh ML-DSA-87 keypair, marks the classical key Deprecated,
  # links new ↔ old via x-pqctoday-supersedes, re-issues the Sign.
  # 2026-07-04: was ECDSA-P256 only — RSA/P-384/P-521 signing keys kept
  # signing classically forever under the "PQC" policy.
  - type: algorithm_substitution
    ops: [Sign]
    from: ECDSA-P256
    to: ML-DSA-87
    reason: "Rekey legacy ECDSA signing key to ML-DSA-87 at first use"
  - type: algorithm_substitution
    ops: [Sign]
    from: ECDSA-P384
    to: ML-DSA-87
    reason: "Rekey legacy ECDSA-P384 signing key to ML-DSA-87 at first use"
  - type: algorithm_substitution
    ops: [Sign]
    from: ECDSA-P521
    to: ML-DSA-87
    reason: "Rekey legacy ECDSA-P521 signing key to ML-DSA-87 at first use"
  - type: algorithm_substitution
    ops: [Sign]
    from: RSA-3072
    to: ML-DSA-87
    reason: "Rekey legacy RSA-3072 signing key to ML-DSA-87 at first use"

  # ── Existing-key rekey: classical key-establishment → ML-KEM-1024 on
  # Encapsulate (2026-07-05 — the deferral below is now closed) ──────────
  # Classical ECDH key-establishment keys now go through `Encapsulate`
  # (DHKEM mode — `kmip/spec/crossref/kem-encapsulate-decapsulate.yaml`),
  # the same op ML-KEM/hybrid use, so this is a same-op rekey exactly like
  # the Sign-side rules above: engine emits RekeyAndProceed,
  # `encapsulate.rs::rekey_and_encapsulate` mints a fresh ML-KEM-1024 pair,
  # activates both halves, deactivates+supersedes both halves of the old
  # pair, re-issues the Encapsulate. The application (an Encapsulate caller
  # holding the public-key UID) sees only the handle.
  #
  # NOTE on `from:` values — `helpers::qualified_name` derives the qualified
  # algorithm name from bit-length only (pre-existing limitation, not
  # introduced here): X25519 (256 bits) and X448 (448→ default 256) both
  # currently stringify identically to real P-256, i.e. as `ECDH-P256`. That
  # means this ONE rule below already covers P-256/X25519/X448 keys today
  # (harmless — all three correctly migrate to ML-KEM-1024), but a future
  # fix to `qualified_name` to give X25519/X448 their own distinct names
  # would need a corresponding split here.
  - type: algorithm_substitution
    ops: [Encapsulate]
    from: ECDH-P256
    to: ML-KEM-1024
    reason: "Rekey legacy ECDH-P256/X25519/X448 key-establishment key to ML-KEM-1024 at first use"
  - type: algorithm_substitution
    ops: [Encapsulate]
    from: ECDH-P384
    to: ML-KEM-1024
    reason: "Rekey legacy ECDH-P384 key-establishment key to ML-KEM-1024 at first use"
  - type: algorithm_substitution
    ops: [Encapsulate]
    from: ECDH-P521
    to: ML-KEM-1024
    reason: "Rekey legacy ECDH-P521 key-establishment key to ML-KEM-1024 at first use"

  # RSA key-TRANSPORT (Encrypt/Decrypt path, distinct from the ECDH
  # key-ESTABLISHMENT path above) → ML-KEM remains deferred: that is a
  # cross-primitive migration (encrypt → encapsulate) the Encrypt op cannot
  # execute in one call (see `encrypt.rs`'s own honest RekeyAndProceed
  # failure). Do NOT add an `ops: [Encrypt]` substitution to a KEM target
  # until that separate path is built.

  # ── Classical asymmetric Create denied ───────────────────────────────
  # Once flipped to PQC, no new classical asymmetric keys may be created.
  # Existing ones can still be Verify'd / Decrypt'd until rekey completes.
  - type: algorithm_denylist
    ops:
      - CreateKeyPair
      - "CreateKeyPair:KeyAgreement"
      - "CreateKeyPair:Sign"
      - "CreateKeyPair:Encrypt"
    # RSA family entry covers every size; X25519/X448 and ECDH-P521 were
    # missing (new X25519 keys were creatable under the PQC policy —
    # 2026-07-04 gap audit).
    algorithms:
      - RSA
      - ECDSA-P256
      - ECDSA-P384
      - ECDSA-P521
      - ECDH-P256
      - ECDH-P384
      - ECDH-P521
      - Ed25519
      - Ed448
      - X25519
      - X448
    reason: "Classical asymmetric Create denied under PQC policy — use defaults or migrate"
