# Deterministic signing policy — force ML-DSA / SLH-DSA signatures to the
# deterministic variant (FIPS 204 §3.4: rnd ← 0^32; FIPS 205: addrnd ← PK.seed)
# for reproducible, side-channel-conservative signatures.
#
# Demonstrates mechanism *forcing* (gaps plan P3): the
# `mechanism_parameter_default` rule emits a CryptographicParameters override
# that the dispatcher merges into the request — the application's Sign is
# signed deterministically regardless of what it asked for, with no code change.

schema_version: 1

metadata:
  name: deterministic-signing
  description: |
    Force deterministic signing. The WD19 `Deterministic` flag is set by
    policy on EVERY Sign, overriding the client's choice. The flag is
    meaningful only for the lattice/hash PQC signature schemes (FIPS 204
    ML-DSA §3.4: rnd ← 0^32; FIPS 205 SLH-DSA: addrnd ← PK.seed); for
    classical algorithms the dispatcher carries it harmlessly. Applied
    unscoped because mechanism_parameter_default takes a single algorithm
    scalar and the strict loader lint rejects family names — enumerating all
    15 PQC parameter sets as separate rules would add no behaviour.
  authority: pqctoday-hsm/training
  effective: "always"

rules:
  - type: mechanism_parameter_default
    ops: [Sign]
    deterministic: true
    reason: "Deterministic signatures mandated by policy"
    clause: "FIPS 204 §3.4 / FIPS 205 (deterministic variant)"
