# NSA Commercial National Security Algorithm Suite 2.0 (CNSA 2.0) —
# cross-cutting share (modular-policy plan, 2026-08-28). Split from
# `cnsa-2.0.yaml`: CNSA 2.0 is fundamentally a single approved-algorithm
# suite enforced identically across every operation, so almost every rule
# here spans Create/CreateKeyPair/Register/Import/Sign/Encrypt/Encapsulate
# together — genuinely cross-domain, not an artifact of a bare op. Only the
# few truly single-domain rules (AES<256 denial, the SHA-384/512 hash
# allowlist, the three lifecycle gates) moved to the sibling `-signing`/
# `-key-establishment`/`-encryption` modules; everything else stays here
# UNCHANGED. https://media.defense.gov/2022/Sep/07/2003071834/-1/-1/0/CSA_CNSA_2.0_ALGORITHMS_.PDF

schema_version: 3

metadata:
  name: cnsa-2.0-global
  description: |
    Enforces the NSA's CNSA 2.0 algorithm suite, the mandatory algorithm
    set for classified U.S. National Security Systems (NSS) handling
    information up to TOP SECRET. CNSA 2.0 transition timeline: software and
    firmware signing exclusively CNSA 2.0 by 2030 (earliest, since firmware
    roots of trust are hardest to update); most other categories by 2033; all
    NSS quantum-resistant by 2035 (NSM-10). This module denies anything
    outside the CNSA 2.0 approved list — at key creation/import AND at use
    (Sign, Encrypt, Encapsulate). SignatureVerify, Decrypt and Decapsulate
    stay open so legacy artefacts remain verifiable and recoverable during
    the transition; governance rules (classification attribute, usage masks)
    are creation-scoped for the same reason. The compliance_profile_gate at
    the end is a profile label for reporting tools, not a gate — enforcement
    comes from the allowlist/denylist rules above it. NOTE: LMS and XMSS are
    enforced at the policy plane, but this stack's Plane 2 cannot instantiate
    stateful HBS keys yet — they are spec-only here.

    Approved suite (CNSA 2.0):
      - Symmetric:   AES-256
      - Hashing:     SHA-384, SHA-512
      - Signing:     ML-DSA-87 (Module-Lattice Digital Signature Algorithm Level 5)
      - KEM:         ML-KEM-1024 (Module-Lattice KEM Level 5)
      - Hash-based:  LMS (RFC 8554) and XMSS (RFC 8391), SINGLE-TREE only,
                     approved for firmware/software signing.

    Not in CNSA 2.0:
      - HSS and XMSS^MT — the multi-tree variants are explicitly NOT allowed
        (NSA CNSA 2.0 FAQ)
      - ML-DSA-44, ML-DSA-65 (below Level 5)
      - ML-KEM-512, ML-KEM-768 (below Level 5)
      - SLH-DSA (not specified in CNSA 2.0 even though FIPS 205)
      - RSA, ECDSA, EdDSA (post-transition)
      - Falcon, HQC, BIKE, FrodoKEM, Classic McEliece (not on NSA list)

    AES<256 denial, the SHA-384/512 signature-hash allowlist, and the
    per-op lifecycle-Active gates live in the sibling `cnsa-2.0-signing`/
    `-key-establishment`/`-encryption` modules — the rest of the suite is
    enforced here since it applies identically across every operation.

  authority: pqctoday-hsm/training
  effective: "2026-01-01"
  scopes: [global]
  compliance_mapping:
    - { framework: "NSA CNSA-2.0",         status: aligned }
    - { framework: "NIAP PP-MOD CRYPTO",   status: applicable }
    - { framework: "FIPS 140-3",           level: 3 }
    - { framework: "CNSSP-15",             status: aligned }

rules:

  # 1. ONLY CNSA 2.0 approved algorithms — strict allowlist.
  - type: algorithm_allowlist
    ops: [Create, CreateKeyPair, Register, Import, Sign, Encrypt, Encapsulate]
    algorithms:
      - AES-256
      - SHA-384
      - SHA-512
      - HMAC-SHA-384
      - HMAC-SHA-512
      - ML-DSA-87
      - ML-KEM-1024
      # CNSA 2.0 approves ONLY the single-tree stateful HBS schemes LMS and
      # XMSS for firmware/software signing. The multi-tree variants HSS and
      # XMSS^MT are explicitly NOT allowed (NSA CNSA 2.0 FAQ; wolfSSL CNSA 2.0
      # Part 3). Verified 2026-07-01.
      - LMS
      - XMSS
    reason: "Algorithm not in CNSA 2.0 approved suite"

  # 2. Sub-Level-5 ML-KEM and ML-DSA explicitly denied (FIPS-approved but
  #    below CNSA 2.0 strength requirement).
  - type: algorithm_denylist
    ops: [Create, CreateKeyPair]
    algorithms: [ML-KEM-512, ML-KEM-768, ML-DSA-44, ML-DSA-65]
    reason: "CNSA 2.0 requires Level 5 strength: ML-KEM-1024 and ML-DSA-87 only"

  # 3. SHA-256 banned for new keys (must use SHA-384 or SHA-512).
  - type: algorithm_denylist
    ops: [Create, Sign]
    algorithms: [SHA-256, HMAC-SHA-256]
    reason: "CNSA 2.0 requires SHA-384 or SHA-512"

  # 4. All classical asymmetric algorithms denied (post-PQC-transition). Register
  #    /Import are gated too so a banned key can't enter the store out-of-band.
  - type: algorithm_denylist
    ops: [Create, CreateKeyPair, Register, Import]
    algorithms: [RSA, ECDSA-P256, ECDSA-P384, ECDSA-P521, Ed25519, Ed448, X25519, X448]
    reason: "CNSA 2.0 mandates PQC; classical asymmetric not approved for new keys"

  # 5. All non-CNSA-2.0 PQC algorithms denied.
  - type: algorithm_denylist
    ops: [Create, CreateKeyPair]
    algorithms:
      - SLH-DSA-SHA2-128s
      - SLH-DSA-SHA2-128f
      - SLH-DSA-SHA2-192s
      - SLH-DSA-SHA2-192f
      - SLH-DSA-SHA2-256s
      - SLH-DSA-SHA2-256f
      - SLH-DSA-SHAKE-128s
      - SLH-DSA-SHAKE-128f
      - SLH-DSA-SHAKE-192s
      - SLH-DSA-SHAKE-192f
      - SLH-DSA-SHAKE-256s
      - SLH-DSA-SHAKE-256f
      - Falcon-512
      - Falcon-1024
      - HQC-128
      - HQC-192
      - HQC-256
      - BIKE-L1
      - BIKE-L3
      - FrodoKEM-640
      - FrodoKEM-976
      - FrodoKEM-1344
      - Classic-McEliece-348864
      - Classic-McEliece-460896
      - Classic-McEliece-6688128
    reason: "Algorithm not in CNSA 2.0 (FIPS-approved alternatives not in NSA suite)"

  # 6. Custom attribute required tagging the CNSA classification — at key
  #    creation/ingress ONLY (explicit ops).
  - type: require_custom_attribute
    attribute_name: pqctoday-cnsa-classification
    algorithms: [ML-DSA-87, ML-KEM-1024, AES-256, LMS, XMSS]
    ops: [Create, CreateKeyPair, Register, Import]
    reason: "CNSA 2.0 keys must declare x-pqctoday-cnsa-classification (Unclassified|Secret|TopSecret)"

  # 7. Stateful HBS usage mask — LMS/XMSS must carry Sign+Verify (stateful:
  #    track remaining one-time signatures). Creation-scoped.
  - type: require_usage_mask
    algorithm: LMS
    flags: [Sign, Verify]
    ops: [Create, CreateKeyPair, Register, Import]
    reason: "LMS keys must declare Sign+Verify (stateful — track remaining signatures)"
  - type: require_usage_mask
    algorithm: XMSS
    flags: [Sign, Verify]
    ops: [Create, CreateKeyPair, Register, Import]
    reason: "XMSS keys must declare Sign+Verify (stateful — firmware/software signing)"

  # 8. Compliance profile catch-all.
  - type: compliance_profile_gate
    profile: CNSA-2.0
    ops: [Create, CreateKeyPair, Sign, Encrypt, Encapsulate]
    reason: "Request fails CNSA 2.0 compliance profile"
