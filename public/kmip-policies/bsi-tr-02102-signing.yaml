# BSI TR-02102-1 (Germany) — signing share (modular-policy plan,
# 2026-08-28). Split from `bsi-tr-02102.yaml`. Pair with
# `bsi-tr-02102-key-establishment`, `-encryption`, and `-global`.
#
# Sources (verified): BSI TR-02102-1 "Cryptographic Mechanisms:
# Recommendations and Key Lengths"; BSI PQC migration roadmap. This file is
# a training illustration, not a conformance attestation.

schema_version: 3

metadata:
  name: bsi-tr-02102-signing
  description: |
    Signatures use ML-DSA / SLH-DSA / stateful hash-based schemes (LMS, HSS,
    XMSS, XMSS-MT) or — until end-2035, per BSI's transition allowance —
    classical ECDSA/RSA/EdDSA; RSA signing must use PSS. Hybrid (composite)
    signing is RECOMMENDED, matching BSI's stance (BSI recommends but does
    not mandate hybrid signatures): requests tagged
    x-pqctoday-hybrid-sign=required are held to the ML-DSA-65 + ECDSA-P384
    composite. Hashing restricted to SHA-2/SHA-3.
  authority: pqctoday-hsm/training
  effective: "2026-01-01"
  scopes: [signing]
  compliance_mapping:
    - { framework: "BSI TR-02102-1", status: aligned }
    - { framework: "NIST IR 8547",    status: aligned }

rules:
  # Signature allowlist — the schemes BSI TR-02102-1 recognises: ML-DSA,
  # SLH-DSA, the SP 800-208 stateful HBS family, the LAMPS composites, and
  # (until the end-2035 transition, below) classical ECDSA/RSA/EdDSA.
  - type: algorithm_allowlist
    ops: ["CreateKeyPair:Sign", Sign]
    algorithms:
      - ML-DSA-65
      - ML-DSA-87
      - SLH-DSA-SHA2-128s
      - SLH-DSA-SHA2-128f
      - SLH-DSA-SHA2-192s
      - SLH-DSA-SHA2-192f
      - SLH-DSA-SHA2-256s
      - SLH-DSA-SHA2-256f
      - SLH-DSA-SHAKE-128s
      - SLH-DSA-SHAKE-128f
      - SLH-DSA-SHAKE-192s
      - SLH-DSA-SHAKE-192f
      - SLH-DSA-SHAKE-256s
      - SLH-DSA-SHAKE-256f
      - LMS
      - HSS
      - XMSS
      - XMSS-MT
      - ML-DSA-65-ECDSA-P384
      - ML-DSA-65-Ed25519
      - ML-DSA-87-ECDSA-P384
      - ECDSA-P256
      - ECDSA-P384
      - ECDSA-P521
      - RSA
      - Ed25519
      - Ed448
    reason: "Signature scheme not recognised by BSI TR-02102-1"
    clause: "BSI TR-02102-1 §2.1/§5.3"

  # Hybrid signing on demand — BSI RECOMMENDS hybrid signatures; requests
  # that opt in via x-pqctoday-hybrid-sign=required are held to the
  # ML-DSA-65 + ECDSA-P384 composite. composite_oid is the IANA-registered
  # LAMPS OID (informational — not enforced).
  - type: hybrid_dual_sign_requirement
    primary: ML-DSA-65
    secondary: ECDSA-P384
    effective_from: "2026-01-01"
    effective_until: "2035-12-31"
    ops_affected: ["CreateKeyPair:Sign", Sign]
    # id-MLDSA65-ECDSA-P384-SHA512 (LAMPS composite-sigs, IANA arc
    # 1.3.6.1.5.5.7.6; verified on datatracker 2026-07-01).
    composite_oid: "1.3.6.1.5.5.7.6.46"
    triggered_by_custom_attribute: { name: pqctoday-hybrid-sign, value: required }
    reason: "Request opted into hybrid signing: composite ML-DSA-65 + ECDSA-P384 required"
    clause: "BSI TR-02102-1 §2.1/§5.3"

  # BSI permits classical-only signatures until the end of 2035; from 2036
  # classical signing and classical signing-key creation are over.
  - type: temporal_cutoff
    op: "CreateKeyPair:Sign"
    algorithm_class: classical
    after: "2036-01-01"
    reason: "BSI transition ends 2035: classical signing-key creation banned"
    clause: "BSI TR-02102-1 §2.1/§5.3"
  - type: temporal_cutoff
    op: Sign
    algorithm_class: classical
    after: "2036-01-01"
    reason: "BSI transition ends 2035: classical signing banned"
    clause: "BSI TR-02102-1 §2.1/§5.3"

  # RSA signatures must use PSS padding (BSI does not recommend PKCS#1
  # v1.5 for new use).
  - type: mechanism_parameter_constraint
    ops: [Sign]
    algorithm: RSA
    allowed_padding_methods: [PSS]
    reason: "BSI: RSA signatures must use PSS padding"

  - type: hash_algorithm_allowlist
    ops: [Sign, SignatureVerify]
    hashing_algorithms: [SHA-256, SHA-384, SHA-512, SHA3-256, SHA3-384, SHA3-512]
    reason: "BSI permits only SHA-2 / SHA-3 for signature hashing"

  - type: lifecycle_state_gate
    op: Sign
    allowed_states: [Active]
    reason: "Sign only with Active keys"
