# PQC migration policy, 2030 cutoff — signing share (modular-policy plan,
# 2026-08-28). Split from `pqc-migration-2030.yaml`. Pair with
# `-key-establishment`, `-encryption`, and `-global`.

schema_version: 3

metadata:
  name: pqc-migration-2030-signing
  description: |
    Before 2030-01-01, classical signatures remain allowed for
    backward-compatible verification of legacy artefacts. From 2027-01-01
    no NEW classical signing key may be created (new signing keys are PQC,
    or the LAMPS ML-DSA-65+Ed25519 composite for requests that opt in via
    x-pqctoday-hybrid-sign=required). After 2030-01-01, classical signing
    is banned entirely (verify of pre-cutoff material remains allowed
    indefinitely — it's a consumer op on material already fixed to an
    algorithm, nothing to migrate).

    Signature hashing is restricted to SHA-2/SHA-3 here rather than in a
    standalone global module — unlike `fips-hashing.yaml`, this rule is
    tightly coupled to THIS policy's own migration narrative (gates only
    `Sign`, not `SignatureVerify` too), not meant as a swappable
    cross-cutting add-on.
  authority: pqctoday-hsm/training
  effective: "2026-01-01"
  scopes: [signing]
  compliance_mapping:
    - { framework: "NIST IR 8547 (ipd)", status: stricter-than }
    - { framework: "CNSA-2.0",           status: partial }

rules:
  - type: hash_algorithm_allowlist
    ops: [Sign]
    hashing_algorithms:
      - SHA-256
      - SHA-384
      - SHA-512
      - SHA-512/224
      - SHA-512/256
      - SHA3-256
      - SHA3-384
      - SHA3-512
    reason: "Signature hashing restricted to SHA-2/SHA-3 (SHA-1/MD5 banned at all times)"

  # Worked example of the recommended deprecation pattern (A1, 2026-08-28
  # gaps-remediation plan): the SAME condition as the rule below, written
  # twice — `severity: warn` from this policy's own effective date
  # (continuous early notice, PolicyWarned in the audit trail, no app
  # impact) paired with the `severity: deny` (default) rule below that
  # actually starts refusing from 2027-01-01. Ordered BEFORE that rule
  # deliberately: Pass 2 walks rules in file order, and a `severity: deny`
  # rule short-circuits — listing it first would make this warn rule
  # permanently unreachable (and dead-code-flagged by the visual editor's
  # static lint) from 2027 onward, instead of doing its one job of warning
  # continuously BEFORE the real cutoff takes over.
  - type: temporal_cutoff
    severity: warn
    op: "CreateKeyPair:Sign"
    algorithm_class: classical
    after: "2026-01-01"
    reason: "Classical signing keys are deprecated — denied by policy from 2027-01-01, see the rule below"

  # No new CLASSICAL signing keys of any kind after 2027-01-01 — from 2027
  # every new signing key must be PQC or a LAMPS composite. Class-based so
  # RSA/ECDSA-P256/P384/P521/EdDSA are all covered.
  - type: temporal_cutoff
    op: "CreateKeyPair:Sign"
    algorithm_class: classical
    after: "2027-01-01"
    reason: "From 2027 new signing keys must be PQC (or LAMPS composite) per migration roadmap"

  # Composite signing on demand: requests tagged
  # x-pqctoday-hybrid-sign=required are held to ML-DSA-65 + Ed25519 during
  # the migration window (defence-in-depth opt-in).
  - type: hybrid_dual_sign_requirement
    primary:   ML-DSA-65
    secondary: Ed25519
    effective_from: "2027-01-01"
    effective_until: "2029-12-31"
    ops_affected: ["CreateKeyPair:Sign", Sign]
    # id-MLDSA65-Ed25519-SHA512 — same LAMPS arc as hybrid-migration-window.
    composite_oid: "1.3.6.1.5.5.7.6.48"
    triggered_by_custom_attribute: { name: pqctoday-hybrid-sign, value: required }
    reason: "Request opted into hybrid signing: composite ML-DSA-65 + Ed25519 required"

  # Hard cutoff: no classical Sign after 2030-01-01.
  - type: temporal_cutoff
    op: Sign
    algorithm_class: classical
    after: "2030-01-01"
    reason: "Classical signing banned by migration roadmap from 2030-01-01"

  - type: lifecycle_state_gate
    op: Sign
    allowed_states: [Active]
    reason: "Signing only with Active keys (no Deactivated/Compromised re-use)"
