# Migration tab — hybrid target state, cross-cutting share (modular-policy
# plan, 2026-08-28). Split from `migration-hybrid.yaml`: the
# classical-algorithm denylist uses bare `CreateKeyPair` (plus redundant
# explicit refinements) — cross-domain, moved here unchanged, identical to
# `migration-pqc-global.yaml`. Pair with `-signing`, `-key-establishment`,
# and `-encryption`.

schema_version: 3

metadata:
  name: migration-hybrid-global
  description: |
    Under the hybrid target state, no classical-only asymmetric algorithm
    may be provisioned — new keys and rekeys must land on ML-DSA or a
    hybrid/PQC KEM. Bare `CreateKeyPair` covers every purpose; the explicit
    `CreateKeyPair:KeyAgreement`/`:Sign`/`:Encrypt` entries are redundant
    with it and kept only for readability.
  authority: pqctoday-hsm/demo
  effective: "2026-01-01"
  scopes: [global]
  compliance_mapping:
    - { framework: "Hybrid KEM + FIPS 204 target state", status: required }

rules:
  - type: algorithm_denylist
    ops:
      - CreateKeyPair
      - "CreateKeyPair:KeyAgreement"
      - "CreateKeyPair:Sign"
      - "CreateKeyPair:Encrypt"
    algorithms:
      - RSA
      - RSA-2048
      - RSA-3072
      - RSA-4096
      - ECDSA-P256
      - ECDSA-P384
      - ECDSA-P521
      - ECDH-P256
      - ECDH-P384
      - ECDH-P521
      - Ed25519
      - Ed448
      - X25519
      - X448
    reason: "Classical asymmetric algorithms retired under the hybrid target state"
