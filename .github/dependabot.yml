version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
    # Batch non-security version bumps monthly and cap open PRs, to keep CI /
    # Actions usage low. Security updates are NOT affected by this schedule.
    open-pull-requests-limit: 3
    groups:
      tailwind:
        patterns:
          - 'tailwindcss'
          - '@tailwindcss/*'
          - 'tailwind-merge'
      eslint:
        patterns:
          - 'eslint'
          - 'eslint-*'
          - '@eslint/*'
          - 'typescript-eslint'
      testing:
        patterns:
          - 'vitest'
          - '@vitest/*'
          - '@testing-library/*'
          - '@playwright/*'
      noble-scure:
        patterns:
          - '@noble/*'
          - '@scure/*'
      # Catch-all so every remaining npm dep batches into ONE grouped PR instead
      # of a separate PR (and CI run) each — the main Actions-burn reduction.
      all-other-npm:
        patterns:
          - '*'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - '*'
