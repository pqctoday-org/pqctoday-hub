version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
    # Batch non-security version bumps monthly and cap open PRs, to keep CI /
    # Actions usage low. Security updates are NOT affected by this schedule.
    open-pull-requests-limit: 3
    # Branch protection on main is `strict: true` (branch must be current), so
    # without this dependabot rebased its PR after EVERY main push and CI
    # re-ran the full job each time — 11 red 30-minute runs on one PR (#624)
    # that could not pass anyway. A stale dependabot branch is rebased by hand
    # (`@dependabot rebase`) when someone is actually about to merge it.
    rebase-strategy: disabled
    # Two majors the plugin ecosystem does not support yet. Both were proposed
    # 2026-09-22 and could not install at all (npm ERESOLVE), so their PRs
    # could never go green and were recreated every month:
    #   typescript 7 — typescript-eslint caps at `<6.1.0` even on its newest
    #     release (8.70.1), so eslint's TypeScript support breaks entirely.
    #   eslint 10   — eslint-plugin-jsx-a11y 6.10.2 caps at `^9`.
    # Remove each entry once its blocker ships support; security updates are
    # NOT affected by ignore rules.
    ignore:
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      # @eslint/js ships in lockstep with eslint and its peer range is an exact
      # major match (`@eslint/js@10.0.1` requires `eslint@^10.0.0`). Holding
      # eslint at 9 without holding this too just moves the ERESOLVE rather
      # than avoiding it — that is what happened on #700.
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
    groups:
      tailwind:
        patterns:
          - 'tailwindcss'
          - '@tailwindcss/*'
          - 'tailwind-merge'
      eslint:
        patterns:
          - 'eslint'
          - 'eslint-*'
          - '@eslint/*'
          - 'typescript-eslint'
      testing:
        patterns:
          - 'vitest'
          - '@vitest/*'
          - '@testing-library/*'
          - '@playwright/*'
      noble-scure:
        patterns:
          - '@noble/*'
          - '@scure/*'
      # Catch-all so every remaining npm dep batches into ONE grouped PR instead
      # of a separate PR (and CI run) each — the main Actions-burn reduction.
      all-other-npm:
        patterns:
          - '*'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - '*'
