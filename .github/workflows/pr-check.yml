name: PR check

# The one GitHub check a pull request CAN pass, so `main` can require it and a
# merge never needs `gh pr merge --admin` (owner decision 2026-09-29, after the
# D20 change left `main` requiring `checks`/`test (1)`/`test (2)` — jobs that
# only run on push to main — and every PR sat BLOCKED; see GATES.md).
#
# What must be proven on a clean machine BEFORE merge and cannot be faked from
# a developer machine: install, the security lint, signature verification, a
# clean build (`pr-check`, ~8–10 min) and the sharded unit suite
# (`pr-test`, ~8 min, in parallel). Since 2026-09-29 the pre-push hook runs
# only the fast local tier; the machine-dependent `test:local` tier runs once
# per release (GATES.md). E2E stays in CI on main (smoke) and nightly (full).
# Data checks run outside this repository before merge (GATES.md).
#
# NO paths-ignore on purpose: a required check that is skipped for some PRs
# (docs-only) leaves those PRs BLOCKED forever — the exact failure this file
# exists to fix. Keep the job name `pr-check`: branch protection requires it.

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full commit graph, as in ci.yml `checks`: checks that compare
          # against origin/main need it. No historical file contents needed:
          # partial clone, because .git is dominated by regenerated artefacts.
          fetch-depth: 0
          filter: blob:none

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        env:
          ONNXRUNTIME_NODE_INSTALL: skip # see ci.yml `checks`
        run: npm ci

      - name: SBOM version list matches package.json (committed copy)
        # `pr-test` only REGENERATES this file inside the runner, so a PR whose
        # committed `sbomVersions.generated.ts` lags package.json went unnoticed
        # until the next pre-push (it sat stale after dependabot #781 until
        # #786). Skipped for dependabot PRs: a bump of an SBOM-listed package
        # changes the list and a bot cannot regenerate it, so those PRs would
        # be red by construction; the coordinator regenerates when merging
        # them (any push from a human actor runs this check again).
        if: github.actor != 'dependabot[bot]'
        run: npm run gen:sbom-versions:check

      - name: Lint
        # Carries the eslint-plugin-security rules. Heap note: see ci.yml.
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: npm run lint

      - name: Verify trust-engine attestations
        run: npm run verify-attestations

      - name: Install Playwright Chromium
        # `npm run build` prerenders routes with Playwright.
        run: npx playwright install chromium --with-deps

      - name: Build
        # Clean-checkout `tsc -b` (the type check) + vite + prerender + budgets.
        # No VITE_* secrets: the PR build is never deployed.
        run: npm run build

  pr-test:
    # The unit suite, moved off the pre-push hook to here on 2026-09-29 (owner
    # decision: fast local pre-push, heavy checks on GitHub). Same as ci.yml
    # `test`. Keep the job name: branch protection requires `pr-test (1)` and
    # `pr-test (2)`.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        env:
          ONNXRUNTIME_NODE_INSTALL: skip # see ci.yml `checks`
        run: npm ci

      - name: Generate SBOM versions (see ci.yml `test`)
        run: npm run gen:sbom-versions

      - name: Unit tests (shard ${{ matrix.shard }}/2)
        run: npx vitest run --shard=${{ matrix.shard }}/2
