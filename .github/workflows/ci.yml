name: CI

# What runs where is written down in GATES.md (repo root). The rule behind this file
# (plan 2026-09-21, github-workflows-audit-and-remediation-plan-09212026.md):
# a GitHub job carries only the checks that guard the quality or security of
# what lands on `main` AND need a clean machine to prove it. Everything
# editorial, style-only, or machine-dependent runs in the local gate
# (`npm run gate:local`, enforced by .husky/pre-push) — and a check runs in
# exactly one of the two places, never both.

on:
  # PR + main-only with concurrency-cancel. Skip the job for pure docs/non-code
  # changes. NOTE: data/** is deliberately NOT ignored — data changes must
  # still run the data gate.
  #
  # The ignore list names files individually rather than `**/*.md`: since
  # 2026-09-21 deploy.yml runs only after a successful CI run, and CHANGELOG.md
  # (imported by src/utils/changelogParser.ts) and src/**/*.md (Learn-module
  # summaries, x509 profile docs — import.meta.glob'd into the bundle) are
  # build INPUTS. A commit touching only those must still build and deploy.
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'CODE_OF_CONDUCT.md'
      - 'SECURITY.md'
      - 'TESTING.md'
      - 'TERMS.md'
      - 'LICENSES.md'
      - 'CONTENT-FRESHNESS.md'
      - 'GATES.md'
      - 'e2e/**/*.md'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'CODE_OF_CONDUCT.md'
      - 'SECURITY.md'
      - 'TESTING.md'
      - 'TERMS.md'
      - 'LICENSES.md'
      - 'CONTENT-FRESHNESS.md'
      - 'GATES.md'
      - 'e2e/**/*.md'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - 'LICENSE'
      - '.gitignore'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The default GITHUB_TOKEN is read-only and nothing here writes back to the
# repository, a PR or an issue (the label/comment steps were removed
# 2026-09-21 — nothing consumed them).
permissions:
  contents: read

jobs:
  # The ONLY job branch protection requires on `main` — keep the name `checks`.
  checks:
    runs-on: ubuntu-latest
    # Measured 2026-09-21 before the rewrite: 28 min of a 30-min cap, of which
    # the unit suite was 15 (now its own sharded job below). What is left is
    # ~13–15 min: lint 2.5, build 6, smoke 2, install + audits ~3.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full commit graph: check-tool-version-bump / check-module-version-bump
          # do `git show origin/main:<path>` and need a merge base, which the
          # default shallow checkout never fetches ("ambiguous argument").
          fetch-depth: 0
          # ...but no historical file CONTENTS. A partial clone fetches the whole
          # commit graph and pulls blobs on demand — only the handful those steps
          # read. Added 2026-08-18 after this job was killed at its cap INSIDE
          # checkout: .git is 3.8 GB, dominated by regenerated artefacts
          # (rag-corpus.json, embeddings.bin) that CI never reads. Mitigation, not
          # the fix — see repo-size-analysis-08182026.md.
          filter: blob:none

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        env:
          # onnxruntime-node (transitive, via @huggingface/transformers — used
          # only by the local embedding-index script) downloads binaries from
          # the network in its postinstall; that download timed out and failed
          # the 4.113.1 merge on main. Its install.js honours this variable
          # (script/install-utils.js parseInstallFlag: 'skip' → exit 0).
          ONNXRUNTIME_NODE_INSTALL: skip
        run: npm ci

      - name: Lint
        # Carries the eslint-plugin-security rules — a security gate, not style.
        #
        # NODE_OPTIONS raises Node's old-space heap above its ~4 GB default.
        # This tree already lints close to that ceiling, and the 2026-09-22
        # eslint-plugin minor bumps (#706) pushed it over: the run died with
        # "FATAL ERROR: Ineffective mark-compacts near heap limit — JavaScript
        # heap out of memory" and exit 134, after ~156 s of mark-compact
        # thrashing at 4,005 MB. The runner has 16 GB, so the ceiling was
        # Node's, not the machine's. Not a lint failure and not a plugin
        # defect — a resource limit we were already brushing against.
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: npm run lint

      - name: Data gate
        # ONE step for every data-truth check (a visitor sees wrong data if any
        # of these fail): referential integrity, archival, loader coverage,
        # regressions, publication dates, evidence, proof gates, freshness and
        # the 140+-check unified validator (which also carries TP-2/TP-3 — the
        # inline threats-proof step that used to live here duplicated it).
        # See package.json `gate:data` for the exact list and GATES.md
        # for what each guards. The unified validator runs with the checks
        # that read gitignored pqctoday-priv evidence caches excluded
        # (validate:data:without-priv) — they cannot pass on a clean checkout.
        run: npm run gate:data

      - name: Verify trust-engine attestations
        # ML-DSA-65 signatures on committed trust artifacts (revisions.jsonl,
        # rag-corpus.json, OSCAL exports, CBOM, community-signals). Hard-fails
        # on any signature mismatch, missing .sig or unknown kid. Runs the
        # public verifier scripts/ci/verify-attestations.ts; the signer stays
        # private. Security — must run on a clean machine.
        run: npm run verify-attestations

      - name: Install Playwright Chromium
        # Needed twice below: `npm run build` prerenders routes with Playwright
        # (scripts/prerender.ts), and the smoke tier drives the built site.
        run: npx playwright install chromium --with-deps

      - name: Build
        # Proves a clean-checkout build (tsc -b + vite + prerender + precache
        # and TLA-import budgets). On main the resulting dist/ is what
        # deploy.yml publishes, so the build carries the same public VITE_*
        # client identifiers deploy used to inject; a PR from a fork simply
        # builds without them.
        env:
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: npm run build

      # E2E smoke tier — the critical user journeys, against the production
      # build (`vite preview` on the dist/ from the Build step). The only
      # browser proof in CI. The full suite runs in the local gate
      # (`npm run gate:e2e`, part of gate:release) and nightly
      # (.github/workflows/e2e-nightly.yml) — Q1 of the 2026-09-21 plan.
      - name: E2E smoke (Chromium, against the build)
        run: npm run test:e2e:ci-smoke

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-smoke
          path: playwright-report/
          retention-days: 7

      - name: Upload build for deploy
        # deploy.yml (workflow_run on this workflow, main only) downloads this
        # instead of rebuilding — so a red CI can no longer deploy, and the
        # 7-minute second build is gone. After the smoke test on purpose: a
        # build the smoke tier rejects is never uploaded. PR runs skip it:
        # nothing consumes it.
        # Retention is short on purpose: deploy runs minutes later, and a
        # dispatch of deploy.yml rebuilds from source anyway.
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 1
          if-no-files-found: error
          # dist/ is ~0.5 GB, mostly wasm and hashed chunks that do not
          # compress; spend the minutes on the deploy, not the zip.
          compression-level: 1

      - name: Check tool version bumps
        # A Playground tool content edit must bump its version so the revision
        # record visitors see stays honest. Cheap; diffs against origin/main.
        if: github.event_name == 'pull_request'
        run: npx tsx scripts/ci/check-tool-version-bump.ts

      - name: Check module version bumps
        # Same contract for Learn modules.
        if: github.event_name == 'pull_request'
        run: npx tsx scripts/ci/check-module-version-bump.ts

      - name: Validate offline-attestation files
        # When approvals/offline-{pr}-*.json files are committed to the PR,
        # verify they (a) match the required schema, (b) name an active SME
        # from reviewers.json, and (c) carry a proxy_github_handle that is a
        # member of at least one CODEOWNERS team owning a changed file.
        # No-ops when no attestation files are present (the common case).
        # See trust-engine explainability doc §5.3.
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.OFFLINE_ATTESTATION_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npx tsx scripts/ci/validate-offline-attestation.ts

      - name: Security Audit
        # LAST on purpose (since 2026-08-09): a failing step aborts the job, and
        # when this was 5th its known-red status meant every gate below it never
        # ran. Runs scripts/ci/audit-gate.ts, which fails on every high/critical
        # advisory EXCEPT ones listed there with a reason and a recheck date, and
        # also fails when an exception expires. The two standing exceptions are
        # `image-size` DoS advisories reached through `pptxgenjs` (no upstream
        # fix; our export path never parses ICNS/JXL/HEIF input). If this is the
        # ONLY red step, it is that; if anything above is red, that one is real.
        run: npm run audit:deps

  test:
    # The unit suite (vitest, ~740 files, 15 min unsharded), split in two so
    # the wall time halves and `checks` no longer sits at its cap. Same
    # config as `npm run test` (vitest run); `--shard` is a vitest built-in.
    # Needs no build output: every fixture the suite reads (public/wasm/*.wasm,
    # public/pyodide/*, the *.generated.ts files) is tracked.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        env:
          ONNXRUNTIME_NODE_INSTALL: skip # see `checks`
        run: npm ci

      # `npx vitest` bypasses npm lifecycle scripts, so package.json's `pretest`
      # hook does NOT fire here — that is why a dependabot bump could still fail
      # SbomSection.test.tsx with a stale generated map even after the hook
      # landed (#699 → #693 still red). Generate explicitly instead of relying
      # on an invocation path this job never takes.
      - name: Generate SBOM versions (the test asserts these match package.json)
        run: npm run gen:sbom-versions

      - name: Unit tests (shard ${{ matrix.shard }}/2)
        run: npx vitest run --shard=${{ matrix.shard }}/2

  gate-cacp:
    # CACP/KMIP playground gate — CI-visible tests (src/components/Playground/kmip,
    # src/wasm/kmip), the local-only suite covering the same paths (booting the
    # real wasm engine is heavier than the default suite budget — project
    # directive 2026-07-01: new suites are local-only), and the wasm-provenance
    # check against a sibling pqctoday-hsm checkout. The only cross-repo drift
    # guard against pqctoday-hsm; make it a required check alongside `checks`.
    #
    # Most of the *.local.test.ts drift guards under src/components/Playground/kmip
    # and src/wasm/kmip compare against a sibling pqctoday-hsm checkout, and
    # most of THOSE no-op gracefully when it's absent (existsSync guard). One does
    # not: ruleCatalog.local.test.ts's catalog<->grammar guard deliberately FAILS
    # LOUDLY instead of skipping ("a rule-vocabulary drift check that can silently
    # never run is not a check at all") — so this job needs a real, if minimal,
    # sibling checkout. Found 2026-08-29. Sparse + shallow-ish: this job only
    # ever reads kmip/src/policy/rule.rs and kmip/policies/*.yaml.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A true sibling of the hub checkout (../pqctoday-hsm relative to
      # $GITHUB_WORKSPACE, i.e. /home/runner/work/pqctoday-hub/pqctoday-hsm) —
      # exactly where the *.local.test.ts drift guards above look for it.
      # actions/checkout@v7's `path` refuses to place a checkout outside
      # $GITHUB_WORKSPACE ("Repository path ... is not under ...") — found
      # 2026-08-29. A plain `git clone` has no such restriction.
      #
      # NOT shallow: sync:wasm:check:cacp-kmip (inside gate:cacp) needs real
      # commit ancestry — `git rev-list --count <recordedCommit>..<baseline>` to
      # detect wasm drift. A `--depth 1` clone truncates history to the tip and
      # made that rev-list miscount (observed 2026-09-04: "1 commit behind" for
      # a range a full clone resolved as 0, hard-failing the gate on every hsm
      # main commit). `--filter=blob:none` keeps it cheap — commit/tree objects
      # eagerly, blobs lazily.
      - name: Checkout sibling pqctoday-hsm (sparse — drift-guard sources only)
        run: |
          git clone --filter=blob:none --sparse \
            https://github.com/pqctoday-org/pqctoday-hsm.git ../pqctoday-hsm
          git -C ../pqctoday-hsm sparse-checkout set kmip/src/policy kmip/policies

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        env:
          ONNXRUNTIME_NODE_INSTALL: skip # see `checks`
        run: npm ci

      - name: CACP/KMIP playground gate
        run: npm run gate:cacp
