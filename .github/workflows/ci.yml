name: CI

on:
  # Already PR + main-only with concurrency-cancel. Additionally skip the heavy
  # job for pure docs/non-code changes. NOTE: data/** is deliberately NOT ignored
  # — data changes must still run the audit gates.
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Token permissions for downstream steps. GitHub's default GITHUB_TOKEN is
    # read-only since 2023; these grants are needed for:
    #   - "Apply WASM label"      uses actions/github-script to add a PR label
    #                              (`issues:write` covers PR labels — labels live
    #                              on the issues endpoint).
    #   - "Post CSV diff comment" posts a sticky review comment on the PR
    #                              (`pull-requests:write`).
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Full history so later steps that diff against origin/main work.
          # The "Detect WASM backend changes" + "Post CSV diff comment" steps
          # both run `git diff --name-only origin/main...HEAD`, which fails
          # with "ambiguous argument" on the default shallow (fetch-depth: 1)
          # checkout because origin/main is never fetched.
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security Audit
        run: npm audit --audit-level=high --omit=dev

      - name: Check Formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Audit protocol matrix refs
        run: npm run audit:matrix-refs

      - name: Check sandbox scenarios are in sync with the sandbox source
        # src/data/sandboxScenarios.ts is generated from
        # pqctoday-sandbox/ui/src/data/scenarios.ts by scripts/sync-sandbox-scenarios.ts.
        # Fails if someone edited the generated file by hand or forgot to re-run
        # `npm run sync:sandbox` after the sandbox source changed (the 2026-06-17
        # drift that shipped vaporware/stale scenarios to the hub).
        # The script itself no-ops (exit 0) when the sibling sandbox checkout is
        # absent, so this only fails on genuine drift.
        run: npm run sync:sandbox:check

      - name: Audit vendor-id referential integrity
        # Catches wrong VND-* assignments in the product catalog (e.g. a product
        # pointing to a deprecated vendor, or a VND that resolves to a completely
        # different company). See scripts/audit-vendor-refs.ts for details.
        run: npm run audit:vendor-refs

      - name: Audit module infographic coverage
        # Verifies every MODULE_CATALOG entry has public/images/infographics/pqcstd_<id>.png.
        # CuriousSummaryBanner has no fallback chain — a missing PNG renders as a broken image.
        run: npm run audit:module-infographics

      - name: Audit timeline aliases
        run: npm run audit:timeline-aliases

      - name: Audit migration-phase tagging (step filter never silently empties)
        # Guards the Migrate catalog's migration_phases column against the 7-step
        # framework: every step reachable, no unknown tokens, empty ratio capped.
        run: npm run audit:migration-phases

      - name: Audit timeline evidence (every active row resolves to local file)
        # Verifies that every active row in the latest timeline_*.csv has an
        # acceptable entry in public/timeline/evidence/manifest.json
        # (download_status ∈ {ok, paywall, skipped}). Catches regressions
        # where a CSV row is added without electronic evidence backing.
        # Audit-only — no network calls, deterministic.
        run: npm run audit:timeline-evidence

      - name: Audit compliance country tokens
        run: npm run audit:compliance-countries

      - name: Check compliance-data.json freshness
        # Fails if public/data/compliance-data.json was last committed more than
        # 30 days ago. Uses git log (not mtime) so the check is accurate in CI.
        # To unblock: run ./build-data.sh or npx tsx scripts/scrape-compliance.ts --force
        # in pqctoday-priv, copy the output here, and commit.
        run: npm run check:compliance-fresh -- --max-days 30

      - name: Audit data regressions (no silent record/field loss)
        # Diffs HEAD against the base branch and BLOCKS if compliance-data.json
        # loses records, or a vendor roadmap entry goes from non-empty PQC
        # algorithms to empty. Both are silent-data-loss classes that a normal
        # diff review misses on these large machine-generated files. Intentional
        # drops are opt-in via scripts/ci/data-regression-allowlist.json.
        run: npm run audit:data-regressions

      - name: Audit semantic tokens (no hardcoded colours)
        run: npm run audit:tokens

      - name: Timeline facts derived from the CSV (single source of truth)
        # Fails if src/data/timelineFacts.generated.ts is stale vs the timeline
        # CSV — i.e. the CSV was edited without regenerating, or the generated
        # file was hand-edited. Keeps the sim/pages in sync with the one source.
        run: npm run gen:timeline-facts:check

      - name: Audit content freshness (dated claims < 90d)
        # Non-blocking on first rollout — flags time-sensitive claims (CMVP/FIPS
        # status, protocol-matrix snapshot, Q-Day anchor) that have aged past the
        # review window. Remove `continue-on-error` to make it gate once the
        # first quarterly pass has cleared the backlog (see CONTENT-FRESHNESS.md).
        run: npm run audit:content-freshness
        continue-on-error: true

      - name: Verify trust-engine attestations
        # Verify ML-DSA-65 signatures on committed trust artifacts
        # (revisions.jsonl, rag-corpus.json, OSCAL exports, CBOM,
        # community-signals). Hard-fails on any signature mismatch, missing
        # .sig file, or unknown kid. Closes audit gap P4. See
        # docs/attestation/key-management.md for the operational policy.
        #
        # Runs against the public verifier `scripts/ci/verify-attestations.ts`
        # (self-contained, no imports from gitignored `scripts/attestation/*`).
        # The maintainer's signer stays private.
        run: npm run verify-attestations

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Build
        run: npm run build

      - name: Validate OSCAL output (optional)
        run: |
          if command -v oscal-cli &> /dev/null; then
            oscal-cli validate public/data/pqctoday-oscal.json --as assessment-results
          else
            echo "OSCAL CLI not present — skipping schema validation"
          fi
        continue-on-error: true

      - name: Test
        run: npm run test

      # E2E smoke tier — the critical user journeys, gated on every PR. Runs the
      # @smoke-tagged specs against the production build (`vite preview`, served
      # from the dist/ produced by the Build step above) with bounded workers, so
      # it stays fast and reliable. The heavy/WASM full suite runs nightly
      # (.github/workflows/e2e-nightly.yml), off the per-PR critical path.
      # (E2E was removed from CI 2026-04-02 for being "too slow"; this re-gates a
      # lean subset rather than the whole 240-test suite.)
      - name: E2E smoke (Chromium, against the build)
        run: npm run test:e2e:ci-smoke

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-smoke
          path: playwright-report/
          retention-days: 7

      - name: Validate threats proof rule (TP-2 + TP-3, BLOCKING)
        # TP-2 (local_file path must live under public/threats/) and TP-3
        # (trusted_source_id must resolve to the authoritative-sources
        # catalog id) are stringly-checkable invariants that don't depend
        # on disk presence.
        #
        # TP-1 (on-disk proof file ≥ 5 KB) was DROPPED from CI 2026-05-21
        # because public/threats/*.pdf and public/threats/*.html are
        # gitignored (.gitignore:280-281) — a CI gate that asserts files
        # MUST exist when the gitignore says they MUST NOT be checked in
        # is a self-contradiction guaranteed to false-positive on every
        # clean checkout. The threats UI never consumes `local_file` at
        # runtime (the column is metadata/provenance only — verified by
        # tracing transformThreat() in src/data/threatsData.ts), so the
        # invariant gates nothing the user sees. The TP-1 check still
        # exists in scripts/validators/threats-proof-rule.ts for local
        # dev use after a manual download run; it just isn't enforced in
        # CI.
        run: |
          npx tsx -e "
            import { runThreatsProofRule } from './scripts/validators/threats-proof-rule.ts'
            const results = runThreatsProofRule().filter((r) => r.id !== 'TP-1')
            let failed = false
            for (const r of results) {
              const ok = r.status === 'PASS'
              console.log((ok ? '✓ ' : '✗ ') + '[' + r.id + '] ' + r.description)
              if (!ok) {
                failed = true
                for (const f of r.findings.slice(0, 20)) {
                  console.log('    row ' + f.row + ' ' + f.field + '=' + JSON.stringify(f.value) + ' — ' + f.message)
                }
                if (r.findings.length > 20) console.log('    … +' + (r.findings.length - 20) + ' more')
              }
            }
            if (failed) process.exit(1)
          "

      - name: Audit workshop flows
        # Static audit: every cue in public/workshop/*.json must resolve to a
        # real route / data-workshop-target slug / fixture key / artifact slug
        # in current src/. Exits non-zero on any BLOCKER. WARN/INFO advisory.
        run: npx tsx scripts/audit-workshop-flows.ts

      - name: Extract PR labels
        if: github.event_name == 'pull_request'
        id: pr-labels
        run: |
          LABELS=$(echo '${{ toJson(github.event.pull_request.labels) }}' | jq -r '[.[].name] | join(",")')
          echo "labels=$LABELS" >> $GITHUB_OUTPUT

      - name: Post CSV diff comment
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_LABELS: ${{ steps.pr-labels.outputs.labels }}
        run: npx tsx scripts/ci/post-csv-diff.ts
        continue-on-error: true

      - name: Detect WASM backend changes
        if: github.event_name == 'pull_request'
        id: wasm-detect
        run: |
          CHANGED=$(git diff --name-only origin/main...HEAD)
          if echo "$CHANGED" | grep -qE '^(public/dist/|src/wasm/)'; then
            echo "wasm_changed=true" >> $GITHUB_OUTPUT
          fi
          if echo "$CHANGED" | grep -q 'package.json'; then
            if git diff origin/main...HEAD -- package.json | grep -qE '@oqs/liboqs-js|@pqctoday/softhsm-wasm'; then
              echo "wasm_changed=true" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Apply WASM label
        if: github.event_name == 'pull_request' && steps.wasm-detect.outputs.wasm_changed == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['tool:wasm-backend']
            })

      - name: Check tool version bumps
        if: github.event_name == 'pull_request'
        run: npx tsx scripts/ci/check-tool-version-bump.ts

      - name: Check module version bumps
        if: github.event_name == 'pull_request'
        run: npx tsx scripts/ci/check-module-version-bump.ts

      - name: Validate offline-attestation files
        # When approvals/offline-{pr}-*.json files are committed to the PR,
        # verify they (a) match the required schema, (b) name an active SME
        # from reviewers.json, and (c) carry a proxy_github_handle that is a
        # member of at least one CODEOWNERS team owning a changed file.
        # No-ops when no attestation files are present (the common case).
        # See trust-engine explainability doc §5.3.
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.OFFLINE_ATTESTATION_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npx tsx scripts/ci/validate-offline-attestation.ts

  kat-node24:
    # Cross-impl KATs (mldsa-cross-impl / mlkem-cross-impl): Node's own
    # OpenSSL backend signs/encapsulates, our public/wasm/openssl.wasm
    # verifies/decapsulates (and vice versa). This is the strongest
    # available signal that a WASM rebuild didn't silently break wire
    # compatibility — but the tests gate on `nodeMajor >= 24` internally
    # and self-skip otherwise, so they were exercising nothing on the
    # `checks` job's Node 20. A separate job (rather than a second
    # setup-node inside `checks`) keeps the main job's toolchain at the
    # pinned Node 20 everything else in this repo assumes.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Use Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cross-impl KATs (src/test/kat/)
        run: npx vitest run src/test/kat/

  append-revision:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    # Branch protection on main rejects the in-job `git push` with GH006;
    # the trust-engine provenance log (public/data/revisions.jsonl) is frozen
    # until issue #294 lands the GitHub-App-based fix. Marking continue-on-error
    # so the false-red CI signal stops drowning real failures.
    continue-on-error: true
    permissions:
      contents: write
      pull-requests: read

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          token: ${{ secrets.REVISION_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Resolve merged PR number
        id: pr-info
        run: |
          PR_NUMBER=$(gh pr list --state merged --base main --json number,mergeCommit \
            --jq ".[] | select(.mergeCommit.oid == \"$GITHUB_SHA\") | .number" | head -1)
          echo "pr_number=${PR_NUMBER:-0}" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Append revision entry
        if: steps.pr-info.outputs.pr_number != '0'
        env:
          GITHUB_TOKEN: ${{ secrets.REVISION_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_PR_NUMBER: ${{ steps.pr-info.outputs.pr_number }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npx tsx scripts/ci/append-revision.ts
