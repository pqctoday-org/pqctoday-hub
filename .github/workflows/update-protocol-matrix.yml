name: Update Protocol Matrix

on:
  schedule:
    - cron: '0 9 * * 1' # Mondays at 09:00 UTC
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh-stages:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Deterministic Stage Refresh
        id: refresh
        # No LLM in CI (per project policy: no API keys / Ollama in CI).
        # Only the deterministic datatracker refresh runs here. Exit code 1
        # means "drift detected" (reports written) — that is the trigger for
        # the PR job below. Any other non-zero exit is a real script failure
        # and must fail the workflow loudly, not be swallowed.
        run: |
          set +e
          python3 scripts/enrich-protocol-matrix.py
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 1 ] && [ -f reports/protocol-matrix-updates.json ]; then
            echo "drift=true" >> "$GITHUB_OUTPUT"
            # reports/ is gitignored, so surface the review doc in the run log
            echo "--- reports/protocol-matrix-changes.md ---"
            cat reports/protocol-matrix-changes.md
          else
            echo "::error::enrich-protocol-matrix.py failed (exit $code) — this is NOT drift"
            exit "$code"
          fi

      - name: Audit Matrix Hygiene
        run: npm run audit:matrix-refs

      - name: Apply Stage Drift (in-place edit)
        if: steps.refresh.outputs.drift == 'true'
        run: npx tsx scripts/apply-protocol-matrix-updates.ts --apply --allow-dirty

      - name: Open PR if changed
        if: steps.refresh.outputs.drift == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: 'chore(matrix): refresh protocol-matrix stages from IETF datatracker'
          title: 'chore(matrix): weekly protocol-matrix stage refresh'
          body: |
            Automated weekly refresh of the PQC Protocol Support Matrix
            (`src/data/pqcProtocolMatrix.ts`).

            - Source: IETF datatracker (deterministic — no LLM)
            - Review report: `reports/protocol-matrix-changes.md` in the
              triggering Actions run log (reports/ is not tracked in git)
            - Hygiene gate: `npm run audit:matrix-refs` passed before this PR.

            Please review the diff against the report before merging. The
            apply script is idempotent — re-running it without changes
            is a no-op.
          branch: chore/protocol-matrix-refresh
          delete-branch: true
          add-paths: |
            src/data/pqcProtocolMatrix.ts
