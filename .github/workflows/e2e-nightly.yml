name: E2E (nightly full suite)

# The complete e2e suite — including the heavy WASM/crypto specs — runs once a
# day (and on demand), OFF the per-PR critical path so it doesn't slow PRs or
# burn Actions minutes on every push. The fast @smoke subset gates PRs in ci.yml.
# This run is NOT a required/branch-protected check (cron + workflow_dispatch
# triggers can't attach to a PR's head SHA the way branch protection needs
# anyway), so a spec that only lives here can regress on `main` for up to 24h
# before anyone sees it. e2e/acvp-validator.spec.ts is the one exception: it's
# also in SMOKE_SPECS (playwright.config.ts) as of 2026-08-23, so it still runs
# here too (redundant coverage, cheap) but a regression in it is now caught
# per-PR by ci.yml's required `checks` job instead of waiting for this run.
on:
  schedule:
    - cron: '0 7 * * *' # 07:00 UTC daily
  workflow_dispatch: {}

# Don't pile up nightly runs if one is slow.
concurrency:
  group: e2e-nightly
  cancel-in-progress: true

jobs:
  e2e-full:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Build
        run: npm run build

      - name: E2E full suite (shard ${{ matrix.shard }}/2)
        # Generous per-test timeout: the WASM/real-crypto specs (ML-KEM/ML-DSA,
        # softhsm, openssl, SSH/IKE handshakes) legitimately need minutes.
        run: npx playwright test --project=chromium --timeout=180000 --shard=${{ matrix.shard }}/2

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-nightly-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 14
