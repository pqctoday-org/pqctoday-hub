name: E2E (nightly full suite)

# The complete e2e suite — including the heavy WASM/crypto specs — runs once a
# day (and on demand), OFF the per-PR critical path so it doesn't slow PRs or
# burn Actions minutes on every push. The fast @smoke subset gates PRs in ci.yml.
on:
  schedule:
    - cron: '0 7 * * *' # 07:00 UTC daily
  workflow_dispatch: {}

# Don't pile up nightly runs if one is slow.
concurrency:
  group: e2e-nightly
  cancel-in-progress: true

jobs:
  e2e-full:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Build
        run: npm run build

      - name: E2E full suite (shard ${{ matrix.shard }}/2)
        run: npx playwright test --project=chromium --shard=${{ matrix.shard }}/2

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-nightly-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 14
