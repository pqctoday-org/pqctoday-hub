name: Update CVE Snapshot

on:
  schedule:
    - cron: '0 9 * * 1' # Weekly, Monday 09:00 UTC (offset from compliance scrape at 08:00)
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'

      - name: Run NVD scraper
        # NVD_API_KEY is optional but recommended — bumps the rate limit from
        # 5 req/30s to 50 req/30s, cutting runtime ~30 min → ~3 min. Without
        # the secret, the script falls back to public-rate (slower but works).
        # continue-on-error so a failure still opens a tracking issue below
        # instead of going unnoticed — this exact silent-failure mode (a
        # missing scripts/scrape-nvd.py) previously ran red for weeks with
        # nothing surfacing it outside `gh run list` history.
        id: scrape
        continue-on-error: true
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: python3 scripts/scrape-nvd.py

      - name: Open tracking issue on scrape failure
        if: steps.scrape.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `CVE snapshot scrape failed (week of ${context.runId})`,
              body: [
                'The weekly NVD CVE snapshot refresh (`update-cve.yml`) failed.',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'public/data/cve-snapshot.json was NOT updated this run — the Crypto',
                'Vulnerability Watch tool is now serving an older snapshot than usual.',
                'Check the run log for the failure, fix it, and re-run via workflow_dispatch.',
              ].join('\n'),
              labels: ['cve-snapshot:failure'],
            })

      # Was a direct push to main via stefanzweifel/git-auto-commit-action —
      # failed on EVERY run since main's branch protection went live
      # (confirmed: 5 straight failures 2026-06-25 through 2026-07-06, all
      # "GH006: Protected branch update failed... Changes must be made
      # through a pull request"). The scraper itself was working fine the
      # whole time; only the push mechanism was broken. Fixed 2026-07-11 to
      # match update-protocol-matrix.yml's existing PR-based pattern — that
      # workflow already handles this correctly. create-pull-request is a
      # no-op when there's no diff, so this doesn't open empty weekly PRs.
      - name: Open PR if snapshot changed
        if: steps.scrape.outcome == 'success'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: 'chore(data): update cve-snapshot.json'
          title: 'chore(data): weekly CVE snapshot refresh'
          body: |
            Automated weekly refresh of the CVE snapshot (`public/data/cve-snapshot.json`)
            from NVD.

            - Source: NVD API (deterministic — no LLM)
            - No manual review content beyond the diff itself; this is a
              scheduled data pull, not enrichment.
          branch: chore/cve-snapshot-refresh
          delete-branch: true
          add-paths: |
            public/data/cve-snapshot.json

      - name: Fail the job if the scrape failed
        if: steps.scrape.outcome == 'failure'
        run: exit 1
