name: Trusted-Source Freshness Audit

on:
  schedule:
    - cron: '0 9 * * 1' # Mondays at 09:00 UTC
  workflow_dispatch:
    inputs:
      baseline:
        description: 'Force baseline mode (overwrite stored hashes)'
        required: false
        default: 'false'

permissions:
  contents: write
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run trusted-source freshness audit
        id: audit
        # Exit codes: 0 = no drift, 20 = drift detected (report written),
        # anything else = the script itself failed. Only exit 20 opens an
        # issue; a real script failure fails this workflow loudly instead
        # of opening a bogus "drift" issue from a stale report file.
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.baseline }}" = "true" ]; then
            FLAGS="--baseline"
          fi
          # Remove any stale report so the issue step can never pick up
          # output from a previous run.
          rm -f public/data/trusted-source-drift-report.md
          set +e
          npx tsx scripts/audit-trusted-source-freshness.ts $FLAGS
          code=$?
          set -e
          if [ "$code" -eq 20 ]; then
            echo "drift=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 0 ]; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::freshness audit script failed (exit $code) — this is NOT drift"
            exit "$code"
          fi

      - name: Open issue on drift
        if: steps.audit.outputs.drift == 'true'
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: 'Trusted-source drift detected (week of ${{ github.run_id }})'
          content-filepath: public/data/trusted-source-drift-report.md
          labels: trusted-source:drift, trust-engine

      - name: Commit updated baseline
        # Only the hash baseline is persisted. The drift report is a per-run
        # artifact surfaced via the issue above — committing it caused stale
        # reports to be re-published as "drift" when later runs crashed.
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7
        with:
          commit_message: 'chore(trust-engine): refresh trusted-source hash baseline [skip ci]'
          file_pattern: 'public/data/trusted-source-hashes.json'
