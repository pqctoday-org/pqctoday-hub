general_rule:
  id: RecoSecuLongTerme
  trigger_iso: 2030-01-01
  clause: "Section 2.1"
  quote: "En cas d'utilisation prevue au-dela du 1er janvier 2030 d'un mecanisme cryptographique ou de l'existence d'un risque d'attaque retroactive sur celui-ci, il est recommande de viser une securite post-quantique."
  english: "Where a cryptographic mechanism is intended to be used beyond 1 January 2030, or where there is retroactive-attack risk, post-quantum security should be targeted."

classical_deprecation:
  - mechanism: RSA
    problem: factorisation
    rule_id: RegleFactorisation
    min_key_size_bits: 2048
    valid_until_iso: 2030-12-31
    then_min_key_size_bits: 3072
    then_from_iso: 2031-01-01
    clause: "Section 2.2.1.1"
    quote: "La taille minimale du module est de 2048 bits, pour une utilisation ne devant pas depasser la fin de l'annee 2030. Pour une utilisation a partir de l'annee 2031, la taille minimale du module est de 3072 bits."
    recommendation: "RecoFactorisation: use >= 3072 bits even for use not exceeding 2030."
  - mechanism: DH (finite field)
    problem: discrete-log-GF(p)
    rule_id: RegleLogDiscretGFp
    min_key_size_bits: 2048
    valid_until_iso: 2030-12-31
    then_min_key_size_bits: 3072
    then_from_iso: 2031-01-01
    clause: "Section 2.2.1.2"
    subgroup_order_min_bits: 250
  - mechanism: ECDH / ECDSA
    problem: discrete-log-elliptic-curve
    note: "Elliptic-curve minimum sizes are unchanged by the 2030/2031 step; the post-quantum obligation comes from RegleSecuAsym + ReglePQSecuAsym instead."

pqc_introduction:
  hybrid_required: true
  hybrid_rule_ids: [RegleSecuAsym, ReglePQSecuAsym]
  hybrid_clause: "Section 2.2 / 2.4"
  quote: "Utilise sans hybridation et quel que soit le jeu de parametres utilise, le mecanisme d'encapsulation de cles ML-KEM ne respecte pas la regle RegleSecuAsym."
  mechanisms:
    - name: ML-KEM
      function: KEM
      standardised_by: FIPS 203
      hybrid_required: true
      parameter_notes:
        ML-KEM-512: "conformant only when hybridised with a classical mechanism; ML-KEM-768 preferred"
        ML-KEM-768: "preferred level"
        ML-KEM-1024: "conformant when hybridised"
      standalone_allowed: false
    - name: ML-DSA
      function: signature
      standardised_by: FIPS 204
      hybrid_required: true
      standalone_allowed: false
      clause: "Section 2.4"
    - name: SLH-DSA
      function: signature
      standardised_by: FIPS 205
      hybrid_required: false
      standalone_allowed: true
      standalone_from_iso: 2030-01-01
      clause: "Section 2.4"
      quote: "Le mecanisme de signature numerique SLH-DSA defini dans le FIPS 205 ... peut donc etre utilise tel quel apres 2030."

