# Cross-check reference for the Algorithms > Transition Guide tab.
# Reference artefact only — nothing here has been written into src/data.
standard_id: KR-KCMVP-ALGORITHM-LIST
document_class: gap-record         # no dated mechanism catalogue exists yet
authority:
  name: "National Intelligence Service / KISA (Korea Cryptographic Module Validation Program)"
  short: NIS / KISA
  country: KR
  region_scope: [KR]
status: NO_DATED_CATALOGUE
finding: >
  South Korea has a mechanism list (the KCMVP validated-algorithm list, 22 algorithms) and it has
  selected four national PQC algorithms, but as of 2026-07-28 there is no published Korean document
  in the BSI/ANSSI class: nothing states a per-algorithm end date, and the KCMVP list does not yet
  contain any post-quantum algorithm.
verification:
  verified_on: 2026-07-28
  method: web search only — no Korean primary source retrieved or text-verified
  confidence: MEDIUM
  caveat: "Treat every claim in this file as unverified against a primary source. The KCMVP list itself was not downloaded."

existing_mechanism_list:
  name: "KCMVP 검증대상 암호알고리즘 (KCMVP validated algorithms)"
  count: 22
  post_quantum_entries: 0
  classical_entries:
    block_ciphers: [ARIA, SEED, LEA, HIGHT]
    public_key_encryption: [RSAES]
    signature: [RSA-PSS, KCDSA, EC-KCDSA, ECDSA]
    key_establishment: [DH, ECDH]
    hash: [SHA-2, SHA-3, LSH]
    mac: [CMAC, GMAC, HMAC]
    drbg: [CTR-DRBG, HASH-DRBG, HMAC-DRBG]
    kdf: [KBKDF, PBKDF]
  expected_change: "KCMVP 3.0 is expected to add ML-KEM and ML-DSA; Korean KpqC algorithms pending NIS/KISA evaluation. No published date."

national_pqc_selection:
  programme: "KpqC — Korean Post-Quantum Cryptography Competition"
  launched: 2021-11
  round_1_finalists: 2023-12
  final_selection_iso: 2025-01-16
  selected:
    - {name: "NTRU+",   function: KEM}
    - {name: "SMAUG-T", function: KEM}
    - {name: "AIMer",   function: signature}
    - {name: "HAETAE",  function: signature}
  standardisation_status: "Selected by competition; not yet published as a dated national algorithm standard with validity horizons."

national_policy_dates:
  document: "범국가 암호체계 전환 마스터플랜 (Pan-national Cryptographic Transition Master Plan)"
  issuer: "NIS + MSIT + related ministries"
  announced: 2023-07
  document_class: migration-roadmap
  milestones:
    - {year: 2024, item: "detailed action plans across 6 areas (technology, institutions, procedures)"}
    - {year: 2030, item: "implementation base for systematic transition to quantum-resistant cryptography established"}
    - {year: 2035, item: "transition to post-quantum cryptography completed; technical and policy support system in place"}
  classical_deprecation_dates: null

classical_deprecation: null
classical_deprecation_note: "No Korean document publishes an end date for RSA, ECDSA, ECDH, DH or KCDSA."

crosscheck:
  transition_tab_region_values: ["KpqC", "KR"]
  rows_currently_present: 16     # 12 tagged KR (status 'KpqC Round 2'), 4 tagged KpqC (status 'Candidate')
  data_defect: >
    The tab carries two separate region values for one country and labels the four algorithms
    'KpqC Round 2' / 'Candidate' when they were finally SELECTED on 2025-01-16. Both status
    strings are stale by 18 months, and the KR rows point at kpqc.cryptolab.co.kr (a
    participant-team site) rather than kpqc.or.kr (the programme site).
