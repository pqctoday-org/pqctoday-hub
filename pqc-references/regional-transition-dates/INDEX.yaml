    CH: "No NCSC-CH catalogue located."
    NL: "AIVD/TNO/CWI PQC Migration Handbook (2nd ed., Dec 2024) is a migration guide, not a mechanism catalogue with dates."
  apac: [SG, HK, TW, NZ, MY, TH, ID]
