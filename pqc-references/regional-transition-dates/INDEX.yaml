# Regional cryptographic-standard date reference — index
#
# Purpose: cross-check the Algorithms > Transition Guide tab (AlgorithmComparison, fed by
#          src/data/algorithms_transitions_*.csv) against what each region's own authority
#          actually publishes.
#
# THIS DIRECTORY IS A REFERENCE ARTEFACT. Nothing here has been written into src/data.
#
# Two document classes are tracked and MUST NOT be conflated:
#   mechanism-catalogue  — enumerates every mechanism (classical AND post-quantum) with key sizes
#                          and, in the good ones, a validity horizon per mechanism.
#                          Archetypes: BSI TR-02102-1, ANSSI PG-083.
#   migration-roadmap    — organisational deadlines only; no algorithm list, no key sizes.
#                          Archetypes: UK NCSC timelines, EU NIS CG roadmap.
#   gap-record           — a region where no dated catalogue exists; recorded so the absence is
#                          explicit rather than silent.

generated_iso: 2026-07-28
generated_against:
  transitions_csv: src/data/algorithms_transitions_06252026.csv
  region_filter: src/components/Algorithms/AlgorithmFilters.tsx (REGION_ITEMS)
  library_csv: src/data/library_07272026_r3.csv
  doc_cache: pqctoday-priv/public/library

