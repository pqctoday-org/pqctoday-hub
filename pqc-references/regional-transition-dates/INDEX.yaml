# Regional cryptographic-standard date reference — index
#
# Purpose: cross-check the Algorithms > Transition Guide tab (AlgorithmComparison, fed by
#          src/data/algorithms_transitions_*.csv) against what each region's own authority
#          actually publishes.
#
# THIS DIRECTORY IS A REFERENCE ARTEFACT. Nothing here has been written into src/data
# EXCEPT algorithms_transitions_07282026.csv and AlgorithmFilters.tsx (REGION_ITEMS),
# both changed 2026-07-29 to ground the tab against the standards below. See
# regional-crypto-standards-grounding-plan-07282026.md (workspace root) for the plan
# this executed and regional-crypto-standards-gap-report-07282026.md for the original audit.
#
# Three document classes are tracked and MUST NOT be conflated:
#   mechanism-catalogue  — enumerates mechanisms (classical AND/OR post-quantum) with key sizes
#                          and, in the good ones, a validity horizon per mechanism.
#                          Archetypes: BSI TR-02102-1, ANSSI PG-083.
#   migration-roadmap    — organisational deadlines only; no algorithm list, no key sizes.
#                          Archetypes: UK NCSC timelines, EU NIS CG roadmap.
#   gap-record           — a region where no dated catalogue (or no PQC content at all) exists;
#                          recorded so the absence is explicit rather than silent.
#
# GROUNDING RULE (added 2026-07-28, applied 2026-07-29): a REGION_ITEMS filter value survives
# only if at least one row cites a real reference standard — not a competition-results page, not
# a roadmap with no algorithm list, not an empty status_url, not a participant/team site standing
# in for the standards body. KpqC, CACR, CN, KR and Global were removed from the filter on this
# basis; the underlying CSV rows were retained (never deleted) and annotated.

