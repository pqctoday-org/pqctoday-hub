no_catalogue_found:
  reconfirmed_2026_07_29: >
    CH, NL, and SG were re-checked with fresh, differently-worded searches in the 2026-07-29
    gap-closure pass specifically to test whether the original wide search had simply missed
    something. It hadn't — same verdict both times. HK, TW, and the Nordics were also
    re-checked. One correction worth flagging: a secondary source claimed Singapore's MAS
    Quantum Advisory names CRYSTALS-Kyber/Dilithium/FALCON/SPHINCS+ specifically — checked the
    actual document directly (both the cached copy and a fresh fetch attempt) and found no such
    algorithm list. The secondary source was wrong; not corroborated, not added.
