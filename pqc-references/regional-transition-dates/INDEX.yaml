    CH: "No NCSC-CH/MELANI algorithm catalogue found. FINMA guidance (financial-sector risk survey, Nov 2025-Jan 2026) is risk guidance, not an algorithm list."
    NL: "AIVD/TNO/CWI PQC Migration Handbook (2nd ed., Dec 2024) confirmed still a migration guide, not a mechanism catalogue with dates."
    SE/NO/DK/FI: "No country-specific catalogues found on a second pass either. Sweden co-signed a Jan 2024 QKD position paper with ANSSI/BSI/NLNCSA (policy, not an algorithm catalogue). Norway launched a national quantum-technology strategy process in May 2025 (not crypto-specific)."
    BE/AT/PL/IE/EE: "Participate in the EU NIS-CG roadmap and the 2024 joint 18-member-state statement; no independent national mechanism catalogue found for any of the five."
