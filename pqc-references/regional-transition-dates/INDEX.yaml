    SG: "MAS Advisory (2024-02-20) and CSA Quantum-Safe Handbook (2024-06) remain advisories; no algorithm list, no dates. Checked the MAS advisory PDF directly a second time (2026-07-29) after a secondary source claimed it named specific algorithms — it doesn't."
