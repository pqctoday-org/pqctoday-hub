# Cross-check reference for the Algorithms > Transition Guide tab.
# Reference artefact only — nothing here has been written into src/data.
standard_id: AU-ASD-ISM-CRYPTOGRAPHY
document_class: mechanism-catalogue        # covers ALL mechanisms, classical + PQC
authority:
  name: Australian Signals Directorate
  short: ASD
  country: AU
  region_scope: [AU, FIVEEYES]
document:
  designation: "ISM — Guidelines for Cryptography"
  title: "Australian Government Information Security Manual, Guidelines for Cryptography"
  current_release: "June 2026"
  cadence: quarterly
  verified_release: "December 2024"
  language: en
  url: https://www.cyber.gov.au/business-government/asds-cyber-security-frameworks/ism/cyber-security-guidelines/guidelines-for-cryptography
  current_release_url: "https://www.cyber.gov.au/sites/default/files/2026-06/Information%20security%20manual%20(June%202026).pdf"
coverage:
  classical_mechanisms: true
  pqc_mechanisms: true
  per_mechanism_end_dates: true
  symmetric_and_hash: true
  significance: "The most aggressive per-algorithm deprecation schedule of any national authority found in this audit — a single hard 2030 cliff covering classical AND the lower PQC parameter sets."
verification:
  verified_on: 2026-07-29
  method: >
    CLOSED via Wayback Machine (2026-07-29 gap-closure pass, second attempt after direct
    curl/WebFetch to the live cyber.gov.au domain both timed out twice). Two snapshots
    retrieved and text-extracted directly: (1) the live 'Guidelines for cryptography' HTML
    page, snapshot dated 2026-06-21 — i.e. genuinely current, not a secondary summary; (2)
    the official 'ISM June 2026 changes' PDF, snapshot dated 2026-07-24.
  finding: >
    Snapshot (1) shows every control text quoted in classical_deprecation/pqc_parameter_deprecation
    below verbatim, each with its own ASD control ID and 'Revision'/'Updated' metadata — and
    every one of those controls is stamped 'Updated: Dec-24'. That is direct, first-hand
    confirmation (not secondary corroboration) that the December 2024 wording this file already
    quoted is STILL the live wording as of the June 2026 release; nothing in these specific
    controls changed. Snapshot (2) confirms what changed in June 2026 was scope/terminology
    only: the 'data protection' principle was renamed to 'cryptographic protection', and two
    existing controls (media encryption, network protocol encryption) were reworded to "capture
    all scenarios" — no date or algorithm changed.
