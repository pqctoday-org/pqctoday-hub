classical_deprecation:
  - mechanism: RSA
    condition: "modulus >= 1900 bits and < 3000 bits"
    classification: legacy
    expires_iso: 2025-12-31
    clause: "Nota 34 [RSA Heredado]"
    quote_es: "La fecha limite aceptable para el uso heredado de un modulo de tamano superior a 1900 bits, pero inferior a 3000 bits, se establece en el 31 de diciembre de 2025."
    note: "Identical deadline to ECCG Agreed Cryptographic Mechanisms' Note 30-LegacyRSA — Spain's national guide mirrors the EU-level document almost exactly on this point."
  - mechanism: "DH / finite-field discrete log"
    condition: "prime modulus >= 1900 bits and < 3000 bits"
    classification: legacy
    expires_iso: 2025-12-31
    clause: "Nota 36 [DLP Heredado]"
  - mechanism: "DHE (TLS 1.3 groups)"
    condition: "2048-bit groups"
    classification: legacy
    expires_iso: 2030-12-31
    clause: "Section on TLS 1.3, para 257"
    quote_es: "se sugiere el uso de grupos de 3072 bits o mas (se aceptan grupos de 2048 bits para la proteccion de datos, solo hasta 2030)"

pqc_introduction:
  mechanisms:
    - name: ML-KEM
      function: KEM
      standardised_by: FIPS 203
      classification: R
      clause: "Tabla B.7 (approved parameter sets), Tabla B.8 (key/ciphertext byte sizes)"
    - name: ML-DSA
      function: signature
      standardised_by: FIPS 204
      classification: R
      clause: "Tabla B.9 (parameter sets)"
    - name: SLH-DSA
      function: signature
      standardised_by: FIPS 205
      classification: R
      clause: "Tabla B.12 (parameter sets)"
    - name: XMSS
      function: signature
      standardised_by: "RFC 8391 / NIST SP 800-208"
      classification: R
      clause: "Section B.3.2"
      note: "Recommended only for firmware/software signature verification use ('unicamente para verificacion de FW/SW'), per para 2791."

