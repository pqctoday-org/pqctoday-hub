  designation: "NZISM 17.1 — Cryptographic Fundamentals; 17.2 — Approved Cryptographic Algorithms"
  version: "3.9"
  as_of: 2025-11
  url: "https://nzism.gcsb.govt.nz/ism-document/pdf/Section/15746"
  url_17_2: "https://nzism.gcsb.govt.nz/ism-document/pdf/Section/15853"
finding: >
  NZISM v3.9 (November 2025) is real and current, and Section 17.1 explicitly acknowledges the
  quantum threat and points to Section 17.2 (Approved Cryptographic Algorithms) / 17.3 (Approved
  Cryptographic Protocols) for the actual algorithm list. But 17.1 itself states no PQC algorithm
  has been approved yet and sets no date: "quantum resistant algorithms are expected to be
  developed, standardised and approved for use. Until such time, however, agencies should be
  positioning themselves..." It also states migration from RSA to ECC is "no longer specifically
  advised" if not already underway — an unusual, dated-sounding stance that predates any NZ PQC
  approval. Downgraded from the gap report's "priority, plausible real catalogue" expectation to
  a confirmed gap-record for grounding purposes: real document, wrong content for this need.
verification:
  verified_on: 2026-07-29
  method: primary-source PDF downloaded and text-extracted for BOTH sections (17.1 and, as of
    the 2026-07-29 gap-closure pass, 17.2 as well — this is a genuine re-fetch of a document
    the original audit found only as a broken 2KB stub in a stale cache directory; the live
    gcsb.govt.nz copies fetched cleanly for both)
  follow_up_CLOSED: >
    Section 17.2 (Approved Cryptographic Algorithms) fetched 2026-07-29. Confirmed: RSA
    (min 2048-bit), DSA (legacy only), DH, ECDH, ECDSA, SHA-256/384/512, AES, 3DES (legacy),
    PBKDF2. NO post-quantum algorithm of any kind (ML-KEM, ML-DSA, SLH-DSA, or any other NIST
    PQC candidate) appears anywhere in 17.2. This confirms rather than overturns the 17.1
    finding — New Zealand genuinely has nothing to cite yet, checked exhaustively across both
    the general-fundamentals and the algorithm-approval sections.

