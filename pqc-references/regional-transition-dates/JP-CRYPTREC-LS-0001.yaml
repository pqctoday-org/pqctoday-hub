structure:
  table_1: "電子政府推奨暗号リスト — e-Government Recommended Ciphers List"
  table_2: "耐量子計算機暗号（PQC）リスト — PQC List  [NEW in the 2026-03-30 revision]"
  other_lists: ["推奨候補暗号リスト (Candidate Recommended)", "運用監視暗号リスト (Monitored Ciphers — the Japanese deprecation mechanism)"]

pqc_introduction:
  table: "Table 2 (PQC List)"
  added_iso: 2026-03-30
  significance: "First formal listing of a post-quantum algorithm in Japanese government procurement policy."
  definition_quote_ja: "現行暗号の解読に利用可能な水準の量子計算機（CRQC）への耐性を有することが確認された暗号技術のリスト"
  mechanisms:
    - name: ML-KEM
      function: key-agreement
      parameter_sets:
        - {set: ML-KEM-768,  nist_category: 3}
        - {set: ML-KEM-1024, nist_category: 5}
    - name: AES
      function: symmetric
      parameter_sets:
        - {set: AES-192, nist_category: 3}
        - {set: AES-256, nist_category: 5}
    - name: SHA2
      function: hash
      parameter_sets:
        - {set: SHA-384, nist_category: 4}
        - {set: SHA-512}
    - name: SHA3
      function: hash
      parameter_sets:
        - {set: SHA3-384, nist_category: 4}
        - {set: SHA3-512}
  signature_entry: null
  signature_note_ja: "署名 — （空欄）"
  signature_note_en: "The signature row of Table 2 is EMPTY. Japan has listed no post-quantum signature algorithm yet; footnote 4 states additions to the PQC List are under consideration (CRYPTREC MT-1501-2026)."
  key_length_criteria_exemption:
    quote_ja: "当面の間、表２（耐量子計算機暗号（PQC）リスト）の公開鍵暗号は、当該設定基準を適用しない。"
    meaning: "For the time being the LS-0003 key-length/security-strength criteria do NOT apply to the public-key entries of the PQC list."

classical_deprecation:
  mechanism: "Monitored Ciphers List (運用監視暗号リスト)"
  note: "Japan deprecates by moving an algorithm to the Monitored list rather than by publishing a per-algorithm sunset year. The dated schedule lives in the companion document — see JP-CRYPTREC-LS-0003."

