  title: "A Coordinated Implementation Roadmap for the Transition to Post-Quantum Cryptography"
  published_iso: 2025-06-23
  pages: 17
  language: en
  landing_url: https://digital-strategy.ec.europa.eu/en/library/coordinated-implementation-roadmap-transition-post-quantum-cryptography
