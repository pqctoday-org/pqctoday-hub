<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="google-site-verification" content="lSSC0h-CK8Ps91057B3Ig-aHiKn8kS58RrIzpRgpAl0" />
    <meta
      name="keywords"
      content="free online pqc education website, free online pqc training, post quantum cryptography education platform free online, Post-Quantum Cryptography, PQC, ML-KEM, ML-DSA, SLH-DSA, NIST, quantum computing, cryptography migration, FIPS 203, FIPS 204, FIPS 205, PKCS#11, HSM, SoftHSM, OpenSSL, liboqs"
    />
    <meta name="author" content="PQC Today" />

    <!--
      Per-route SEO tags — <title>, description, canonical, Open Graph and Twitter
      Card — are emitted by src/seo/PageMeta.tsx and baked into every page by the
      prerender step (scripts/prerender.ts). They are intentionally NOT duplicated
      here: React 19 hoists PageMeta's tags into <head>, so a static copy would
      produce conflicting duplicate canonical / og:title tags on every route.
    -->

    <!-- PWA & Theme -->
    <meta name="theme-color" content="#0EA5C8" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Favicon (light/dark mode) -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-light-32x32.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-dark-32x32.png"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "name": "PQC Today",
            "url": "https://www.pqctoday.com",
            "potentialAction": {
              "@type": "SearchAction",
              "target": {
                "@type": "EntryPoint",
                "urlTemplate": "https://www.pqctoday.com/library?q={search_term_string}"
              },
              "query-input": "required name=search_term_string"
            }
          },
          {
            "@type": "Organization",
            "name": "PQC Today",
            "url": "https://www.pqctoday.com",
            "logo": "https://www.pqctoday.com/favicon.svg",
            "sameAs": [
              "https://github.com/pqctoday-org/pqctoday-hub",
              "https://github.com/pqctoday-org",
              "https://www.youtube.com/@pqctoday"
            ]
          },
          {
            "@type": "WebApplication",
            "name": "PQC Today",
            "url": "https://www.pqctoday.com",
            "description": "The leading free online PQC education website and guided post-quantum cryptography transformation journey. Learn PQC fundamentals, assess your quantum risk, and migrate your cryptography infrastructure in full compliance with NIST, ANSSI, BSI, and applicable regulatory mandates.",
            "applicationCategory": "SecurityApplication",
            "operatingSystem": "Web",
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "USD"
            },
            "author": {
              "@type": "Organization",
              "name": "PQC Today",
              "url": "https://www.pqctoday.com"
            },
            "featureList": [
              "Post-Quantum Cryptography Timeline",
              "Interactive ML-KEM and ML-DSA Demos",
              "PKCS#11 HSM Mode via SoftHSMv3 WASM",
              "OpenSSL WASM Studio",
              "PQC Migration Planning",
              "Compliance Tracker (NIST, ANSSI, Common Criteria)",
              "49 Hands-on Learning Modules",
              "PQC Patent Landscape",
              "PQC Risk Assessment Wizard",
              "Migration Software Catalog"
            ]
          }
        ]
      }
    </script>
    <script>
      // Reload once after the PWA service worker takes control so it can inject
      // Cross-Origin Isolation headers (COEP:credentialless + COOP:same-origin),
      // enabling SharedArrayBuffer for WASM threading on GitHub Pages.
      if (window.crossOriginIsolated === false && !sessionStorage.getItem('coi-reload')) {
        sessionStorage.setItem('coi-reload', '1')
        if (navigator.serviceWorker && navigator.serviceWorker.controller) {
          location.reload()
        } else if (navigator.serviceWorker) {
          navigator.serviceWorker.addEventListener('controllerchange', function () {
            location.reload()
          })
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
